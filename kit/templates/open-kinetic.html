<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opening plate · kinetic type</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.7s;
        --t-wipe-l: 2.95s;
        --t-wipe-r: 3.05s;
        --t-draw: 3.1s;
        --t-word: 3.25s;
        --t-trace: 2.9s;
        --t-travel: 0.6s;
        --t-sweep: 3.95s;
        --t-flare: 1.4s;
        --x-copy: 5.0s;
        --x-logo: 5.12s;
        --t-eyebrow: 0.2s;
        --open-logo: 1;
        --hold-from: 0s;
        --hold-until: 0s;
      }
      /* Kinetic type: the promise IS the picture — oversized words slam in, the mark signs off. */
      .copy-exit {
        position: absolute; left: 150px; right: 150px; top: 47%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: flex-start; text-align: left;
      }
      .settle { display: flex; flex-direction: column; align-items: flex-start; animation: settle 2.6s 1.9s var(--inout) both; }
      @keyframes settle { from { transform: none; } to { transform: translateY(-14px) scale(0.975); } }
      .eyebrow-exit { --xe: 0.3s; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 999px;
        font-size: var(--eyebrow-size); font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--on-accent);
        background: linear-gradient(120deg, var(--gold), var(--amber));
        opacity: 0;
        animation: eyebrowIn 0.8s var(--t-eyebrow) var(--expo) both;
      }
      .eyebrow::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .title {
        margin-top: 30px; max-width: 1560px;
        font-size: {{TITLE_SIZE}}px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.94;
      }
      .title .accent {
        background: linear-gradient(92deg, var(--gold) 0%, var(--amber) 80%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .title .mask.word .rise {
        animation-name: slam; animation-duration: 0.9s; animation-timing-function: var(--expo);
        transform-origin: 0 100%;
      }
      @keyframes slam {
        0% { opacity: 0; transform: translateY(105%) scale(1.32) skewY(7deg); filter: blur(12px); }
        55% { opacity: 1; filter: blur(0); }
        100% { opacity: 1; transform: none; filter: none; }
      }
      .underline-exit { --xe: 0.12s; margin-top: 30px; }
      .underline {
        width: 380px; height: 10px; border-radius: 6px;
        background: linear-gradient(90deg, var(--gold), var(--amber));
        box-shadow: 0 0 30px color-mix(in srgb, var(--gold) 45%, transparent);
        transform: scaleX(0); transform-origin: left center;
        animation: grow 0.9s 1.95s var(--expo) both;
      }
      @keyframes grow { to { transform: scaleX(1); } }
      .sub-exit { --xe: 0s; margin-top: 28px; }
      .sub {
        font-size: 26px; font-weight: 500; color: var(--muted); line-height: 1.4;
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15em 0.35em; max-width: 46ch;
      }
      .sub .word { display: inline-block; opacity: 0; animation: subWordIn 0.9s var(--t) var(--expo) both; }
      .sub .sep { display: inline-block; opacity: 0; color: color-mix(in srgb, var(--muted) 70%, var(--gold)); animation: fadeIn 0.55s var(--t) ease-out both; }
      .sub b { color: var(--text); font-weight: 600; }
      /* Speed streaks cross once on entry; they finish off-frame so no exit is needed. */
      .streak {
        position: absolute; left: 0; height: 2px; width: 900px; z-index: 1; opacity: 0;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gold) 80%, transparent), transparent);
        animation: streak 1.1s var(--d) var(--quint) both;
      }
      .streak.s1 { top: 30%; --d: 0.3s; }
      .streak.s2 { top: 64%; --d: 0.5s; height: 1px; }
      .streak.s3 { top: 73%; --d: 0.72s; width: 600px; }
      @keyframes streak {
        0% { opacity: 0; transform: translateX(-900px); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateX(2200px); }
      }
      .lockup-exit {
        position: absolute; right: 120px; bottom: 96px;
        width: clamp(140px, calc(var(--open-logo-width, 820px) * 0.42), 340px);
        opacity: var(--open-logo, 1);
        animation: exitScale calc(0.7s * var(--open-logo, 1)) var(--x-logo) var(--exit) forwards;
      }
      .lockup { opacity: 0; animation: markIn 1s 2.85s var(--expo) both; }
      .logo { filter: drop-shadow(0 12px 36px color-mix(in srgb, var(--amber) 24%, transparent)); }
      .glow {
        position: absolute; left: -10%; top: 20%; width: 1500px; height: 760px; border-radius: 50%; z-index: 1;
        background: radial-gradient(ellipse at 40% 50%, color-mix(in srgb, var(--amber) 13%, transparent), transparent 66%);
        opacity: 0;
        animation: fadeIn 1.2s 0.2s ease-out both, fadeOut 0.8s var(--x-logo) var(--exit) forwards;
      }
      html[data-frame='portrait'] .copy-exit { left: 72px; right: 72px; top: 44%; }
      html[data-frame='portrait'] .title { font-size: calc({{TITLE_SIZE}}px * 0.82); }
      html[data-frame='portrait'] .sub { font-size: 34px; max-width: none; }
      html[data-frame='portrait'] .eyebrow { font-size: 22px; }
      html[data-frame='portrait'] .lockup-exit { right: 72px; bottom: 140px; width: min(calc(var(--open-logo-width, 820px) * 0.55), 440px); }
    </style>
  </head>
  <body data-duration="6.4" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="glow"></div>
      <div class="streak s1"></div>
      <div class="streak s2"></div>
      <div class="streak s3"></div>
      <div class="copy-exit">
        <div class="settle">
          <div class="line-exit eyebrow-exit">
            <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          </div>
          <h1 class="title" data-fit="{{TITLE_LINES}}" data-fit-min="72" data-reveal="{{TITLE_REVEAL}}" style="--t: {{T_TITLE}}" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
          <div class="line-exit underline-exit"><div class="underline"></div></div>
          <div class="line-exit sub-exit">
            <p class="sub" data-edit="sub" data-edit-kind="source" data-edit-accent="b" data-edit-beats="1" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
          </div>
        </div>
      </div>
      <div class="lockup-exit">
        <div class="lockup">
          <div class="logo">{{LOGO}}</div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
