<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Process plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.2s;
        --black-out: 5.55s;
        --n: {{ITEM_COUNT}};
        --card-in: var(--motion-enter, 0.9s);
      }
      /* Two columns: the thesis sits left; numbered steps stack right along a rail that draws down. */
      .compose {
        position: absolute; inset: 0;
        display: grid; grid-template-columns: 620px 1fr; gap: 120px; align-items: center;
        padding: 72px 160px 72px 180px;
        animation: fadeOut 0.7s 5.15s var(--exit) forwards;
      }
      .head { z-index: 2; }
      .eyebrow {
        font-size: 15px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold);
        opacity: 0; animation: fadeUp 0.75s 0.18s var(--expo) both;
      }
      .title {
        margin-top: 18px; font-size: 64px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
        opacity: 0; animation: fadeUp 0.9s 0.32s var(--expo) both;
      }
      .sub {
        margin-top: 24px; font-size: 22px; line-height: 1.45; color: var(--muted); max-width: 30ch;
        opacity: 0; animation: fadeUp 0.9s 0.55s var(--expo) both;
      }
      .sub:empty { display: none; }
      .steps {
        display: flex; flex-direction: column; gap: 0;
        --row: calc(min(190px, 760px / var(--n)));
      }
      .p-step {
        position: relative;
        display: grid; grid-template-columns: 150px 1fr; gap: 28px; align-items: start;
        min-height: var(--row);
        --land: 26px;
        opacity: 0; transform-origin: 0% 50%;
        animation: fxLand var(--card-in) var(--s) var(--expo) both;
        will-change: transform, opacity, filter;
      }
      .p-num { position: relative; height: 100%; }
      .p-ghost {
        display: block; font-size: 88px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.9;
        background: linear-gradient(135deg, var(--gold), color-mix(in srgb, var(--amber) 55%, transparent));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0.92;
        font-variant-numeric: tabular-nums;
      }
      .p-dot {
        position: absolute; left: 124px; top: 36px; width: 14px; height: 14px; border-radius: 50%;
        background: linear-gradient(140deg, var(--gold), var(--amber));
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 16%, transparent);
        transform: scale(0);
        animation: fxPop 0.55s calc(var(--s) + 0.2s) var(--pop) both;
      }
      .p-rail {
        position: absolute; left: 130px; top: 58px; bottom: -14px; width: 2px;
        background: linear-gradient(180deg, var(--gold), color-mix(in srgb, var(--gold) 18%, transparent));
        transform: scaleY(0); transform-origin: 50% 0%;
        animation: railGrow 0.7s calc(var(--s) + 0.32s) var(--inout) both;
      }
      @keyframes railGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .p-body { padding-top: 14px; padding-bottom: 18px; }
      .p-label { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.12; }
      .p-note { margin-top: 10px; font-size: 20px; line-height: 1.42; color: var(--muted); max-width: 40ch; }
      .steps[data-n="5"] .p-ghost { font-size: 72px; }
      .steps[data-n="5"] .p-label { font-size: 30px; }
      .steps[data-n="5"] .p-note { font-size: 18px; margin-top: 6px; }
      .steps[data-n="5"] .p-dot { top: 30px; }
      .steps[data-n="5"] .p-rail { top: 50px; }
      .bloom {
        position: absolute; left: 62%; top: 50%; width: 1300px; height: 720px; margin: -360px 0 0 -650px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.2s 0.3s ease-out both, fadeOut 0.7s 5.15s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="6.2">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="3" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.32s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
          <p class="sub" data-edit="sub" data-edit-kind="text" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        </div>
        <div class="steps" data-n="{{ITEM_COUNT}}">{{ITEMS}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
