<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Journey plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 5.8s;
        --black-out: 5.2s;
        --n: {{ITEM_COUNT}};
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 64px; padding: 64px 80px;
        animation: fadeOut 0.7s 4.75s var(--exit) forwards;
      }
      .head { text-align: center; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.8s 0.2s var(--expo) both;
      }
      .title {
        margin-top: 16px; font-size: 64px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
        opacity: 0; animation: fadeUp 0.9s 0.35s var(--expo) both;
      }
      .path {
        width: 100%; max-width: 1720px;
        display: grid;
        grid-template-columns: repeat(var(--n), 1fr);
        gap: 0;
      }
      .j-step {
        display: grid; grid-template-rows: auto 1fr; justify-items: center;
        --land: 24px;
        opacity: 0;
        transform-origin: 50% 70%;
        animation: fxLand var(--motion-enter, 0.9s) var(--s) var(--expo) both;
      }
      .j-rail {
        position: relative; width: 100%; height: 56px;
        display: grid; place-items: center;
      }
      .j-dot {
        width: 52px; height: 52px; border-radius: 50%;
        display: grid; place-items: center;
        font-size: 18px; font-weight: 700; color: var(--on-accent, #041004);
        background: linear-gradient(140deg, var(--gold), var(--amber));
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 16%, transparent);
        z-index: 1;
      }
      .j-line {
        position: absolute; left: 50%; right: -50%; top: 50%; height: 3px; margin-top: -1.5px;
        background: linear-gradient(90deg, var(--gold), color-mix(in srgb, var(--gold) 25%, transparent));
        transform-origin: left center;
        animation: lineGrow 0.8s calc(var(--s) + 0.15s) var(--expo) both;
      }
      @keyframes lineGrow {
        from { transform: scaleX(0); opacity: 0.2; }
        to { transform: scaleX(1); opacity: 1; }
      }
      .j-body {
        margin-top: 28px; width: 92%; min-height: 300px; padding: 40px 24px 34px; border-radius: 26px; text-align: center;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
      }
      .icon {
        width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 20px;
        display: grid; place-items: center; color: var(--gold);
        background: color-mix(in srgb, var(--gold) 14%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent);
      }
      .icon svg { width: 32px; height: 32px; }
      .j-label { font-size: 28px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; text-wrap: balance; }
      .path[data-n="5"] .j-label, .path[data-n="6"] .j-label { font-size: 24px; }
      .path[data-n="5"] .j-note, .path[data-n="6"] .j-note { font-size: 16px; }
      .path[data-n="3"] { max-width: 1440px; }
      .j-note { margin-top: 12px; font-size: 18px; color: var(--muted); line-height: 1.42; text-wrap: balance; max-width: 24ch; }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1300px; height: 560px; margin: -280px 0 0 -650px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 11%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.15s ease-out both, fadeOut 0.7s 4.75s var(--exit) forwards;
      }
      /* Vertical master */
      html[data-frame='portrait'] .head { text-align: left; }
      html[data-frame='portrait'] .path { max-width: none; grid-template-columns: 1fr; gap: 0; }
      html[data-frame='portrait'] .j-step { grid-template-rows: none; grid-template-columns: 48px 1fr; gap: 20px; justify-items: stretch; align-items: stretch; }
      html[data-frame='portrait'] .j-rail { width: 48px; height: auto; place-items: start center; padding-top: 18px; }
      html[data-frame='portrait'] .j-line {
        left: 50%; right: auto; top: 40px; bottom: -40px; width: 3px; height: auto; margin: 0 0 0 -1.5px;
        background: linear-gradient(180deg, var(--gold), color-mix(in srgb, var(--gold) 25%, transparent));
        transform-origin: center top; animation-name: lineGrowDown;
      }
      @keyframes lineGrowDown {
        from { transform: scaleY(0); opacity: 0.2; }
        to { transform: scaleY(1); opacity: 1; }
      }
      html[data-frame='portrait'] .j-body {
        margin: 0 0 18px; width: auto; min-height: 0; padding: 26px 26px; text-align: left;
        display: grid; grid-template-columns: 60px 1fr; column-gap: 18px; align-items: center;
      }
      html[data-frame='portrait'] .j-body .icon { margin: 0; grid-row: span 2; width: 60px; height: 60px; border-radius: 18px; }
      html[data-frame='portrait'] .j-label { font-size: 26px; }
      html[data-frame='portrait'] .path[data-n="3"] .j-body,
      html[data-frame='portrait'] .path[data-n="4"] .j-body { padding: 36px 30px; margin-bottom: 24px; }
      html[data-frame='portrait'] .path[data-n="3"] .j-label,
      html[data-frame='portrait'] .path[data-n="4"] .j-label { font-size: 30px; }
      html[data-frame='portrait'] .path[data-n="3"] .j-note,
      html[data-frame='portrait'] .path[data-n="4"] .j-note { font-size: 19px; }
      html[data-frame='portrait'] .j-note { margin-top: 4px; font-size: 17px; max-width: none; text-wrap: pretty; }
      html[data-frame='portrait'] .bloom { width: 1000px; height: 1300px; margin: -650px 0 0 -500px; }
    </style>
  </head>
  <body data-duration="5.8">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.35s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        </div>
        <div class="path" data-n="{{ITEM_COUNT}}">{{ITEMS}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
