<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logos plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --cols: {{LOGO_COLS}};
        --dur: 5.4s;
        --black-out: 4.8s;
        --n: {{ITEM_COUNT}};
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 44px; padding: 64px 100px;
        animation: fadeOut 0.7s 4.35s var(--exit) forwards;
      }
      .head { text-align: center; max-width: 1100px; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.8s 0.2s var(--expo) both;
      }
      .title {
        margin-top: 14px; font-size: 52px; font-weight: 600; letter-spacing: -0.04em;
        opacity: 0; animation: fadeUp 0.9s 0.35s var(--expo) both;
      }
      .sub {
        margin: 14px auto 0; max-width: 46ch; font-size: 20px; color: var(--muted); line-height: 1.4;
        opacity: 0; animation: fadeUp 0.8s 0.5s var(--expo) both;
      }
      /* 2×3 (or auto) grid fills the mid-frame — no empty lower third */
      /* Balanced rows: the last row centres instead of leaving one tile alone on the left. */
      .wall {
        --gap-x: 32px;
        width: 100%; max-width: 1480px;
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 28px var(--gap-x);
      }
      .wall > .logo-tile { width: calc((100% - (var(--cols) - 1) * var(--gap-x)) / var(--cols)); }
      .logo-tile {
        --land: 22px;
        opacity: 0;
        transform-origin: 50% 80%;
        animation: fxLand var(--motion-enter, 0.9s) var(--s) var(--expo) both;
      }
      /* Tone is set by lib/logoTone.mjs from mark luminance (override with logos[].bg). */
      .logo-frame {
        height: 148px; border-radius: 24px; padding: 28px 32px;
        display: grid; place-items: center;
        border: 1px solid transparent;
        box-shadow: 0 14px 32px color-mix(in srgb, var(--shade, var(--ink)) 35%, transparent);
      }
      .logo-frame[data-tone="light"] {
        background:
          linear-gradient(180deg, #ffffff 0%, color-mix(in srgb, #f4f7f2 70%, var(--gold) 8%) 100%);
        border-color: color-mix(in srgb, #0a1f0a 10%, transparent);
        box-shadow:
          0 1px 0 color-mix(in srgb, #fff 55%, transparent) inset,
          0 16px 36px color-mix(in srgb, var(--shade, var(--ink)) 42%, transparent);
      }
      .logo-frame[data-tone="dark"] {
        background: color-mix(in srgb, var(--surface) 78%, #000 12%);
        border-color: color-mix(in srgb, var(--muted) 28%, transparent);
        box-shadow: 0 14px 32px color-mix(in srgb, var(--shade, var(--ink)) 45%, transparent);
      }
      .logo-frame img {
        max-width: 100%; max-height: 88px; width: auto; height: auto;
        object-fit: contain;
      }
      .logo-frame[data-tone="dark"] img {
        filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--shade, var(--ink)) 35%, transparent));
      }
      .logo-label {
        margin-top: 14px; text-align: center;
        font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em;
      }
      /* ——— Layout: marquee — two rows of tiles glide past each other, the head floats above ——— */
      body[data-layout='marquee'] .compose { gap: 36px; padding: 64px 0; }
      body[data-layout='marquee'] .wall { display: none; }
      .mq { display: none; width: 100%; flex-direction: column; gap: 26px; overflow: hidden;
        mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
      }
      body[data-layout='marquee'] .mq { display: flex; }
      .mq-row { display: flex; gap: 28px; width: max-content; opacity: 0; animation: fadeUp 0.9s var(--s) var(--expo) both, mqL 22s linear var(--s) infinite; }
      .mq-row.rev { animation-name: fadeUp, mqR; }
      .mq-row .logo-tile { width: 300px; flex: none; animation: none; opacity: 1; }
      .mq-row .logo-tile .logo-frame { height: 132px; }
      @keyframes mqL { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      @keyframes mqR { from { transform: translateX(-50%); } to { transform: translateX(0); } }
      /* ——— Layout: cloud — tiles float at different depths and drift like a mobile ——— */
      body[data-layout='cloud'] .compose { justify-content: flex-start; padding-top: 72px; }
      body[data-layout='cloud'] .wall { position: relative; flex: 1; max-width: 1560px; display: block; perspective: 1400px; }
      body[data-layout='cloud'] .wall > .logo-tile {
        position: absolute; left: var(--cx); top: var(--cy); width: 260px;
        transform: translate(-50%, -50%) scale(var(--z, 1)); transform-origin: 50% 50%;
        animation: cloudIn 1.1s var(--s) var(--expo) both, cloudDrift 6.4s calc(var(--s) + 0.8s) ease-in-out infinite alternate;
        filter: blur(calc((1 - var(--z, 1)) * 2.6px));
      }
      body[data-layout='cloud'] .wall > .logo-tile .logo-frame { height: 120px; }
      body[data-layout='cloud'] .wall > .logo-tile .logo-label { display: none; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(1) { --cx: 50%; --cy: 44%; --z: 1.18; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(2) { --cx: 22%; --cy: 30%; --z: 0.98; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(3) { --cx: 78%; --cy: 32%; --z: 1.02; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(4) { --cx: 30%; --cy: 74%; --z: 0.9; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(5) { --cx: 72%; --cy: 76%; --z: 0.94; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(6) { --cx: 10%; --cy: 56%; --z: 0.78; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(7) { --cx: 90%; --cy: 58%; --z: 0.8; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(8) { --cx: 50%; --cy: 88%; --z: 0.74; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(9) { --cx: 38%; --cy: 10%; --z: 0.7; }
      body[data-layout='cloud'] .wall > .logo-tile:nth-child(10) { --cx: 64%; --cy: 8%; --z: 0.72; }
      @keyframes cloudIn { from { opacity: 0; transform: translate(-50%, -30%) scale(calc(var(--z, 1) * 0.7)); } to { opacity: 1; transform: translate(-50%, -50%) scale(var(--z, 1)); } }
      @keyframes cloudDrift { from { translate: 0 -8px; } to { translate: 0 10px; } }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1200px; height: 560px; margin: -280px 0 0 -600px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 10%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.15s ease-out both, fadeOut 0.7s 4.35s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="5.4" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.35s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
          <p class="sub" data-edit="sub" data-edit-kind="text" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        </div>
        <div class="wall">{{ITEMS}}</div>
        {{MARQUEE}}
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
