<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opening plate · device spotlight</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.7s;
        --t-wipe-l: 1.25s;
        --t-wipe-r: 1.37s;
        --t-draw: 1.45s;
        --t-word: 1.65s;
        --t-trace: 1.1s;
        --t-travel: 0.85s;
        --t-sweep: 2.4s;
        --t-flare: 2.1s;
        --x-copy: 5.0s;
        --x-logo: 5.12s;
        --t-eyebrow: 2.95s;
        --open-logo: 1;
        --hold-from: 0s;
        --hold-until: 0s;
      }
      /* Device spotlight: a lit screen tilts up from the floor holding the mark, then steps back for the promise. */
      .cone {
        position: absolute; left: 50%; top: -6%; width: 1500px; height: 1000px; margin-left: -750px; z-index: 1;
        background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 22%, transparent) 0%, color-mix(in srgb, var(--gold) 6%, transparent) 60%, transparent 100%);
        clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
        filter: blur(28px);
        transform-origin: 50% 0;
        opacity: 0;
        animation: coneIn 1.4s 0.15s var(--expo) both, fadeOut 0.8s var(--x-logo) var(--exit) forwards;
      }
      @keyframes coneIn { from { opacity: 0; transform: scaleX(0.3); } to { opacity: 1; transform: scaleX(1); } }
      .floor {
        position: absolute; left: 50%; top: 77%; width: 1300px; height: 200px; margin: -100px 0 0 -650px; border-radius: 50%; z-index: 1;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--amber) 26%, transparent), transparent 70%);
        opacity: 0;
        animation: fadeIn 1.2s 0.8s ease-out both, floorDim 1.1s 2.3s var(--inout) both, fadeOut 0.8s var(--x-logo) var(--exit) forwards;
      }
      @keyframes floorDim { to { transform: translateY(-120px) scale(0.7); } }
      .device-exit {
        position: absolute; left: 50%; top: 45%; width: 1120px; height: 640px; margin: -320px 0 0 -560px; z-index: 2;
        perspective: 1800px; perspective-origin: 50% 100%;
        animation: exitScale 0.75s var(--x-logo) var(--exit) forwards;
      }
      .device-move { position: absolute; inset: 0; transform-origin: 50% 0; animation: stepBack 1.1s 2.25s var(--inout) both; }
      @keyframes stepBack { from { transform: none; } to { transform: translateY(-150px) scale(0.56); } }
      .device {
        position: absolute; inset: 0; border-radius: 34px; padding: 18px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 70%, var(--text)) 0%, color-mix(in srgb, var(--surface) 82%, var(--ink)) 100%);
        box-shadow: 0 60px 140px color-mix(in srgb, var(--ink) 80%, transparent), 0 0 0 1px color-mix(in srgb, var(--gold) 26%, transparent), inset 0 1px 0 color-mix(in srgb, var(--text) 30%, transparent);
        transform-origin: 50% 100%;
        opacity: 0;
        animation: tiltUp 1.6s 0.3s var(--expo) both;
      }
      @keyframes tiltUp {
        0% { opacity: 0; transform: translateY(240px) rotateX(62deg) scale(0.86); }
        30% { opacity: 1; }
        100% { opacity: 1; transform: none; }
      }
      .screen {
        position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden;
        background:
          radial-gradient(ellipse 70% 60% at 50% 40%, color-mix(in srgb, var(--gold) 16%, var(--surface)) 0%, transparent 72%),
          linear-gradient(165deg, var(--surface) 0%, color-mix(in srgb, var(--surface) 72%, var(--ink)) 100%);
        display: grid; place-items: center;
      }
      .chrome {
        position: absolute; left: 22px; top: 18px; display: flex; gap: 9px;
      }
      .chrome i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 45%, var(--surface)); }
      .chrome i:first-child { background: color-mix(in srgb, var(--gold) 80%, var(--surface)); }
      .glare {
        position: absolute; top: -40%; bottom: -40%; width: 30%; left: -40%;
        background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--text) 16%, transparent), transparent);
        transform: skewX(-18deg); opacity: 0;
        animation: glare 1.3s 1.75s var(--inout) both;
      }
      @keyframes glare {
        0% { opacity: 0; left: -40%; }
        25% { opacity: 1; }
        100% { opacity: 0; left: 120%; }
      }
      .lockup-exit { position: relative; width: clamp(220px, calc(var(--open-logo-width, 820px) * 0.8), 600px); opacity: var(--open-logo, 1); }
      .logo { filter: drop-shadow(0 16px 44px color-mix(in srgb, var(--amber) 26%, transparent)); }
      .copy-exit {
        position: absolute; left: 0; right: 0; top: 48%; z-index: 3; padding: 0 160px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .eyebrow-exit { --xe: 0.3s; }
      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-size: var(--eyebrow-size); font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold);
        opacity: 0;
        animation: eyebrowIn 0.95s var(--t-eyebrow) var(--expo) both;
      }
      .eyebrow::before, .eyebrow::after {
        content: ''; width: 40px; height: 1px; background: currentColor;
        opacity: 0; transform: scaleX(0);
        animation: ruleIn 0.75s var(--t-eyebrow) var(--expo) both;
      }
      .title { margin-top: 24px; font-size: {{TITLE_SIZE}}px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.05; }
      .title .accent {
        background: linear-gradient(92deg, var(--gold) 0%, var(--amber) 72%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub-exit { --xe: 0s; margin-top: 26px; }
      .sub {
        font-size: 22px; font-weight: 500; color: var(--muted);
        display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0.15em 0.35em; max-width: 56ch;
      }
      .sub .word { display: inline-block; opacity: 0; animation: subWordIn 0.9s var(--t) var(--expo) both; }
      .sub .sep { display: inline-block; opacity: 0; color: color-mix(in srgb, var(--muted) 70%, var(--gold)); animation: fadeIn 0.55s var(--t) ease-out both; }
      .sub b { color: var(--text); font-weight: 600; }
      html[data-frame='portrait'] .device-exit { width: 900px; height: 1180px; margin: -590px 0 0 -450px; top: 42%; }
      html[data-frame='portrait'] .device-move { animation-name: stepBackTall; }
      @keyframes stepBackTall { from { transform: none; } to { transform: translateY(-40px) scale(0.5); } }
      html[data-frame='portrait'] .copy-exit { top: 44%; padding: 0 64px; }
      html[data-frame='portrait'] .title { font-size: calc({{TITLE_SIZE}}px * 0.86); text-wrap: balance; }
      html[data-frame='portrait'] .sub { font-size: 30px; max-width: none; }
      html[data-frame='portrait'] .eyebrow { font-size: 23px; }
      html[data-frame='portrait'] .floor { top: 70%; }
    </style>
  </head>
  <body data-duration="6.4" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="grid"></div>
      <div class="cone"></div>
      <div class="floor"></div>
      <div class="device-exit">
        <div class="device-move">
          <div class="device">
            <div class="screen">
              <div class="chrome"><i></i><i></i><i></i></div>
              <div class="lockup-exit">
                <div class="lockup">
                  <div class="logo">{{LOGO}}</div>
                </div>
              </div>
              <div class="glare"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="copy-exit">
        <div class="line-exit eyebrow-exit">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        </div>
        <h1 class="title" data-fit="{{TITLE_LINES}}" data-fit-min="50" data-reveal="{{TITLE_REVEAL}}" style="--t: {{T_TITLE}}" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        <div class="line-exit sub-exit">
          <p class="sub" data-edit="sub" data-edit-kind="source" data-edit-accent="b" data-edit-beats="1" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
