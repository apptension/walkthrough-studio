<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Features plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.0s;
        --black-out: 5.35s;
        --n: {{ITEM_COUNT}};
        --card-in: var(--motion-enter, 0.9s);
        --card-pop: var(--motion-pop, 0.94);
        /* Brand mark — Editor Colours & motion → Brand mark (below the cards). */
        --mark-logo: 1;
        --mark-logo-size: 32px;
        --mark-logo-width: 200px;
        --mark-logo-x: 0px;
        --mark-logo-y: 0px;
      }
      /* One vertical composition — title + capability grid fill the FHD frame */
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 40px; padding: 56px 72px 52px;
        animation: fadeOut 0.7s 4.95s var(--exit) forwards;
      }
      .head { text-align: center; flex: none; z-index: 2; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.75s 0.18s var(--expo) both;
      }
      .title {
        margin-top: 16px; font-size: 64px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
        opacity: 0; animation: fadeUp 0.9s 0.32s var(--expo) both;
      }
      /*
        Count-aware grid on Full HD:
        3 → single row of three wide cards
        4 → 2×2
        5 → 3 top + 2 centered below (primary five-card case)
        6 → 3×2
      */
      .cards {
        width: 100%; max-width: 1680px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        flex: none;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        min-height: 320px;
        background:
          linear-gradient(165deg, color-mix(in srgb, var(--gold) 14%, transparent), transparent 48%),
          color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 32%, transparent);
        border-radius: 28px;
        padding: 44px 28px 40px;
        text-align: center;
        box-shadow:
          0 22px 48px color-mix(in srgb, var(--shade, var(--ink)) 48%, transparent),
          inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent);
        --land: 36px;
        opacity: 0;
        transform-origin: 50% 80%;
        animation: fxLand var(--card-in) var(--s) var(--expo) both;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        will-change: transform, opacity, filter;
      }
      .cards[data-n="3"] .card { min-height: 360px; }
      .cards[data-n="4"] {
        max-width: 1280px;
        grid-template-columns: repeat(2, 1fr);
        gap: 32px;
      }
      .cards[data-n="4"] .card { min-height: 300px; }
      /* 6-col spine: top trio spans 2 cols each; bottom pair sits in the center four */
      .cards[data-n="5"] {
        grid-template-columns: repeat(6, 1fr);
        gap: 28px 24px;
      }
      .cards[data-n="5"] .card:nth-child(1) { grid-column: 1 / 3; }
      .cards[data-n="5"] .card:nth-child(2) { grid-column: 3 / 5; }
      .cards[data-n="5"] .card:nth-child(3) { grid-column: 5 / 7; }
      .cards[data-n="5"] .card:nth-child(4) { grid-column: 2 / 4; }
      .cards[data-n="5"] .card:nth-child(5) { grid-column: 4 / 6; }
      .cards[data-n="5"] .card { min-height: 300px; }
      .cards[data-n="6"] {
        grid-template-columns: repeat(3, 1fr);
      }
      .cards[data-n="6"] .card { min-height: 280px; }
      .icon {
        width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 22px;
        display: grid; place-items: center; color: var(--on-accent, #041004);
        background: linear-gradient(145deg, var(--gold), var(--amber));
        box-shadow:
          0 0 0 7px color-mix(in srgb, var(--gold) 18%, transparent),
          0 14px 32px color-mix(in srgb, var(--gold) 32%, transparent);
        animation: fxPop 0.7s calc(var(--s) + 0.18s) var(--pop) both;
      }
      .icon svg { width: 34px; height: 34px; }
      .num {
        position: absolute; top: 18px; right: 22px;
        font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);
        opacity: 0; animation: fadeIn 0.5s calc(var(--s) + 0.35s) ease-out both;
      }
      .label {
        font-size: 28px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15;
      }
      .note {
        margin-top: 14px; font-size: 18px; color: var(--muted); line-height: 1.42;
        text-wrap: balance; max-width: 22ch;
      }
      .corner-logo {
        flex: none;
        width: var(--mark-logo-width, 200px);
        margin-top: var(--mark-logo-y, 0px);
        margin-left: var(--mark-logo-x, 0px);
        opacity: 0;
        animation: markIn 0.85s 1.35s var(--expo) both;
      }
      .bloom {
        position: absolute; left: 50%; top: 52%; width: 1500px; height: 720px; margin: -360px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 14%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.15s 0.15s ease-out both, fadeOut 0.7s 4.95s var(--exit) forwards;
      }
      /* Layout: bento — a hero tile plus a dense mosaic, left-set editorial head. */
      html:not([data-frame='portrait']) body[data-layout='bento'] .head { align-self: stretch; max-width: 1640px; width: 100%; margin: 0 auto; text-align: left; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards,
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n] {
        max-width: 1640px; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(236px, auto); gap: 22px;
      }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n] .card {
        grid-column: auto; min-height: 236px; padding: 30px 32px 30px; border-radius: 30px;
        align-items: flex-start; justify-content: flex-end; text-align: left;
        background: linear-gradient(160deg, color-mix(in srgb, var(--surface) 88%, var(--gold)) 0%, var(--surface) 46%, color-mix(in srgb, var(--surface) 84%, var(--ink)) 100%);
        animation: bentoIn var(--card-in) var(--s) var(--expo) both;
      }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card .icon { margin: 0 0 auto; width: 60px; height: 60px; border-radius: 18px; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card .icon svg { width: 28px; height: 28px; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card .label { margin-top: 22px; font-size: 26px; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card .note { margin-top: 8px; font-size: 17px; max-width: 34ch; text-wrap: pretty; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n] .card:first-child {
        grid-column: span 2; grid-row: span 2;
        background: linear-gradient(150deg, color-mix(in srgb, var(--surface) 70%, var(--gold)) 0%, var(--surface) 58%, color-mix(in srgb, var(--surface) 80%, var(--ink)) 100%);
      }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card:first-child .icon { width: 92px; height: 92px; border-radius: 26px; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card:first-child .icon svg { width: 42px; height: 42px; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card:first-child .label { font-size: 44px; letter-spacing: -0.035em; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .card:first-child .note { font-size: 21px; max-width: 30ch; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n="3"] .card:not(:first-child),
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n="4"] .card:nth-child(2) { grid-column: span 2; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n="6"] .card:first-child { grid-row: auto; }
      html:not([data-frame='portrait']) body[data-layout='bento'] .cards[data-n="6"] .card:last-child { grid-column: span 2; }
      @keyframes bentoIn {
        from { opacity: 0; transform: translateY(44px) scale(0.98); clip-path: inset(0 0 100% 0 round 30px); }
        55% { opacity: 1; }
        to { opacity: 1; transform: none; clip-path: inset(0 0 0 0 round 30px); }
      }
      /* Layout: stack — the capabilities dealt as a fanned hand of cards. */
      html:not([data-frame='portrait']) body[data-layout='stack'] .cards,
      html:not([data-frame='portrait']) body[data-layout='stack'] .cards[data-n] {
        position: relative; display: block; height: 450px; max-width: none;
        --mid: calc((var(--n) - 1) / 2); --spread: calc(1360px / var(--n));
        animation: fanBreath 2.6s 2.2s var(--inout) both;
      }
      @keyframes fanBreath { to { transform: translateY(-8px) scale(1.025); } }
      html:not([data-frame='portrait']) body[data-layout='stack'] .cards[data-n] .card {
        --k: calc(var(--i) - var(--mid));
        position: absolute; left: 50%; top: 0; width: 380px; min-height: 410px; margin-left: -190px;
        justify-content: center; z-index: calc(var(--i) + 1);
        background: linear-gradient(165deg, color-mix(in srgb, var(--surface) 86%, var(--gold)) 0%, var(--surface) 52%, color-mix(in srgb, var(--surface) 82%, var(--ink)) 100%);
        transform-origin: 50% 130%;
        transform: translateX(calc(var(--k) * var(--spread))) translateY(calc(var(--k) * var(--k) * 12px)) rotate(calc(var(--k) * 3.5deg));
        animation: dealIn var(--card-in) var(--s) var(--expo) both;
      }
      @keyframes dealIn {
        0% { opacity: 0; transform: translateX(0) translateY(420px) rotate(calc(var(--k) * -14deg)) scale(0.92); filter: blur(6px); }
        45% { opacity: 1; filter: blur(0); }
        100% { opacity: 1; transform: translateX(calc(var(--k) * var(--spread))) translateY(calc(var(--k) * var(--k) * 12px)) rotate(calc(var(--k) * 3.5deg)); filter: none; }
      }
      /* Layout: carousel — a 3D arc that turns slowly past the viewer. */
      html:not([data-frame='portrait']) body[data-layout='carousel'] .compose { perspective: 2200px; perspective-origin: 50% 46%; }
      html:not([data-frame='portrait']) body[data-layout='carousel'] .cards,
      html:not([data-frame='portrait']) body[data-layout='carousel'] .cards[data-n] {
        position: relative; display: block; height: 440px; max-width: none;
        perspective: none; transform-style: preserve-3d;
        --mid: calc((var(--n) - 1) / 2);
        transform-origin: 50% 50% -1100px;
        animation: arcTurn 5.4s 0.2s cubic-bezier(0.45, 0, 0.55, 1) both;
      }
      @keyframes arcTurn {
        from { transform: rotateY(14deg); }
        to { transform: rotateY(-14deg); }
      }
      html:not([data-frame='portrait']) body[data-layout='carousel'] .cards[data-n] .card {
        --k: calc(var(--i) - var(--mid));
        position: absolute; left: 50%; top: 0; width: 360px; min-height: 400px; margin-left: -180px;
        justify-content: center;
        background: linear-gradient(165deg, color-mix(in srgb, var(--surface) 86%, var(--gold)) 0%, var(--surface) 52%, color-mix(in srgb, var(--surface) 82%, var(--ink)) 100%);
        transform-origin: 50% 50% -1100px;
        transform: rotateY(calc(var(--k) * 21deg));
        backface-visibility: hidden;
        animation: arcIn var(--card-in) var(--s) var(--expo) both;
      }
      @keyframes arcIn {
        from { opacity: 0; transform: rotateY(calc(var(--k) * 21deg)) translateY(140px); filter: blur(8px); }
        to { opacity: 1; transform: rotateY(calc(var(--k) * 21deg)); filter: none; }
      }
      /* Vertical master */
      html[data-frame='portrait'] .head { text-align: left; }
      html[data-frame='portrait'] .cards,
      html[data-frame='portrait'] .cards[data-n] { max-width: none; grid-template-columns: 1fr; gap: 16px; }
      html[data-frame='portrait'] .cards[data-n] .card {
        grid-column: auto; min-height: 0; padding: 24px 28px;
        display: grid; grid-template-columns: 64px 1fr; column-gap: 22px; align-items: center; text-align: left;
      }
      html[data-frame='portrait'] .icon { margin: 0; grid-row: span 2; width: 64px; height: 64px; border-radius: 18px; }
      html[data-frame='portrait'] .note { margin-top: 6px; max-width: none; text-wrap: pretty; }
      html[data-frame='portrait'] .corner-logo { align-self: flex-start; }
      html[data-frame='portrait'] .bloom { left: 50%; top: 55%; width: 1000px; height: 1300px; margin: -650px 0 0 -500px; }
    </style>
  </head>
  <body data-duration="6.0" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.32s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        </div>
        <div class="cards" data-n="{{ITEM_COUNT}}">{{ITEMS}}</div>
        <div class="corner-logo">{{LOGO}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
