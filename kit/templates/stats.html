<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stats plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 5.2s;
        --black-out: 4.6s;
        --n: {{ITEM_COUNT}};
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 56px; padding: 72px 100px;
        animation: fadeOut 0.7s 4.15s var(--exit) forwards;
      }
      .head { text-align: center; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.8s 0.2s var(--expo) both;
      }
      .title {
        margin-top: 14px; font-size: 54px; font-weight: 600; letter-spacing: -0.04em;
        opacity: 0; animation: fadeUp 0.9s 0.35s var(--expo) both;
      }
      .row {
        width: 100%; max-width: 1520px;
        display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 36px;
      }
      .stat {
        text-align: center; padding: 48px 28px 40px; border-radius: 24px; min-height: 280px;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
        --land: 22px;
        opacity: 0;
        transform-origin: 50% 80%;
        animation: fxLand var(--motion-enter, 0.9s) var(--s) var(--expo) both;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .badge {
        height: 48px; min-width: 120px; margin: 0 auto 22px; padding: 8px 16px;
        display: grid; place-items: center; border-radius: 14px;
        border: 1px solid transparent;
      }
      .badge[data-tone="light"] {
        background: linear-gradient(180deg, #fff, #f3f6f1);
        border-color: color-mix(in srgb, #0a1f0a 10%, transparent);
      }
      .badge[data-tone="dark"] {
        background: color-mix(in srgb, var(--surface) 70%, #000 18%);
        border-color: color-mix(in srgb, var(--muted) 24%, transparent);
      }
      .badge img {
        max-height: 32px; max-width: 140px; width: auto; height: auto;
        object-fit: contain;
      }
      .value {
        font-size: 96px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; width: 100%;
        background: linear-gradient(120deg, var(--text), var(--gold));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .label { margin-top: 18px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
      .note { margin-top: 8px; font-size: 16px; color: var(--muted); }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1100px; height: 480px; margin: -240px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.15s ease-out both, fadeOut 0.7s 4.15s var(--exit) forwards;
      }
      /* Layout: burst — each number lands on a medallion with rays fanning out behind it. */
      html:not([data-frame='portrait']) body[data-layout='burst'] .compose { gap: 40px; }
      html:not([data-frame='portrait']) body[data-layout='burst'] .row { max-width: 1640px; gap: 48px; }
      html:not([data-frame='portrait']) body[data-layout='burst'] .stat {
        position: relative; overflow: visible; justify-content: flex-start;
        min-height: 0; padding: 0 12px; background: none; border: 0; border-radius: 0;
        opacity: 1; animation: none;
      }
      html:not([data-frame='portrait']) body[data-layout='burst'] .stat > * { position: relative; z-index: 1; }
      html:not([data-frame='portrait']) body[data-layout='burst'] .stat::before {
        content: ''; position: absolute; left: 50%; top: 150px; width: 640px; height: 640px; margin: -320px 0 0 -320px; border-radius: 50%; z-index: 0;
        background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--gold) 24%, transparent) 0deg 2.5deg, transparent 2.5deg 15deg);
        -webkit-mask-image: radial-gradient(circle, transparent 26%, #000 32%, transparent 68%);
        mask-image: radial-gradient(circle, transparent 26%, #000 32%, transparent 68%);
        opacity: 0;
        animation: raysIn 1.3s calc(var(--s) + 0.1s) var(--expo) both, raysSpin 5.2s linear both;
      }
      @keyframes raysIn { from { opacity: 0; scale: 0.3; } to { opacity: 1; scale: 1; } }
      @keyframes raysSpin { from { rotate: 0deg; } to { rotate: 30deg; } }
      html:not([data-frame='portrait']) body[data-layout='burst'] .stat::after {
        inset: auto; left: 50%; top: 150px; width: 280px; height: 280px; margin: -140px 0 0 -140px; border-radius: 50%; z-index: 0;
        background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--surface) 76%, var(--gold)) 0%, var(--surface) 58%, color-mix(in srgb, var(--surface) 72%, var(--ink)) 100%);
        border: 2px solid color-mix(in srgb, var(--gold) 46%, var(--surface));
        box-shadow: 0 0 0 10px color-mix(in srgb, var(--gold) 8%, transparent), 0 30px 70px color-mix(in srgb, var(--ink) 60%, transparent);
        transform: none; opacity: 0;
        animation: discIn 0.85s var(--s) var(--pop) both;
      }
      @keyframes discIn { from { opacity: 0; scale: 0.55; } to { opacity: 1; scale: 1; } }
      html:not([data-frame='portrait']) body[data-layout='burst'] .value {
        max-width: 236px; margin: 102px auto 0; text-align: center;
        animation: fxPop 0.8s calc(var(--s) + 0.12s) var(--pop) both;
      }
      html:not([data-frame='portrait']) body[data-layout='burst'] .label {
        margin-top: 120px; font-size: 24px;
        opacity: 0; animation: fadeUp 0.8s calc(var(--s) + 0.35s) var(--expo) both;
      }
      html:not([data-frame='portrait']) body[data-layout='burst'] .note {
        opacity: 0; animation: fadeUp 0.8s calc(var(--s) + 0.45s) var(--expo) both;
      }
      html:not([data-frame='portrait']) body[data-layout='burst'] .badge { order: 5; margin: 16px auto 0; }
      /* Vertical master */
      html[data-frame='portrait'] .row { max-width: none; grid-template-columns: 1fr; gap: 18px; }
      html[data-frame='portrait'] .stat {
        min-height: 0; padding: 26px 32px; text-align: left;
        display: grid; grid-template-columns: auto 1fr; column-gap: 28px; align-items: center;
      }
      html[data-frame='portrait'] .stat > .badge { grid-column: 1 / -1; margin: 0 0 14px; justify-self: start; }
      html[data-frame='portrait'] .value { grid-row: span 2; width: auto; font-size: 84px; }
      html[data-frame='portrait'] .label { margin-top: 0; }
      html[data-frame='portrait'] .note { margin-top: 4px; }
      html[data-frame='portrait'] .bloom { width: 1000px; height: 1200px; margin: -600px 0 0 -500px; }
    </style>
  </head>
  <body data-duration="5.2" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.35s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        </div>
        <div class="row">{{ITEMS}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
