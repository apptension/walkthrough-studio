<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stats plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 5.2s;
        --black-out: 4.6s;
        --n: {{ITEM_COUNT}};
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 56px; padding: 72px 100px;
        animation: fadeOut 0.7s 4.15s var(--exit) forwards;
      }
      .head { text-align: center; }
      .eyebrow {
        font-size: 14px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold);
        opacity: 0; animation: fadeUp 0.8s 0.2s var(--expo) both;
      }
      .title {
        margin-top: 14px; font-size: 54px; font-weight: 600; letter-spacing: -0.04em;
        opacity: 0; animation: fadeUp 0.9s 0.35s var(--expo) both;
      }
      .row {
        width: 100%; max-width: 1520px;
        display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 36px;
      }
      .stat {
        text-align: center; padding: 48px 28px 40px; border-radius: 24px; min-height: 280px;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
        --land: 22px;
        opacity: 0;
        transform-origin: 50% 80%;
        animation: fxLand var(--motion-enter, 0.9s) var(--s) var(--expo) both;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .badge {
        height: 48px; min-width: 120px; margin: 0 auto 22px; padding: 8px 16px;
        display: grid; place-items: center; border-radius: 14px;
        border: 1px solid transparent;
      }
      .badge[data-tone="light"] {
        background: linear-gradient(180deg, #fff, #f3f6f1);
        border-color: color-mix(in srgb, #0a1f0a 10%, transparent);
      }
      .badge[data-tone="dark"] {
        background: color-mix(in srgb, var(--surface) 70%, #000 18%);
        border-color: color-mix(in srgb, var(--muted) 24%, transparent);
      }
      .badge img {
        max-height: 32px; max-width: 140px; width: auto; height: auto;
        object-fit: contain;
      }
      .value {
        font-size: 96px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; width: 100%;
        background: linear-gradient(120deg, var(--text), var(--gold));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .label { margin-top: 18px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
      .note { margin-top: 8px; font-size: 16px; color: var(--muted); }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1100px; height: 480px; margin: -240px 0 0 -550px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.15s ease-out both, fadeOut 0.7s 4.15s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="5.2">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.35s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        </div>
        <div class="row">{{ITEMS}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
