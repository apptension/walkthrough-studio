<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Compare plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.2s;
        --black-out: 5.55s;
        --n: {{ITEM_COUNT}};
        --item-size: {{ITEM_SIZE}}px;
        --col-title-size: {{COL_TITLE_SIZE}}px;
        --card-in: var(--motion-enter, 0.9s);
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 44px; padding: 56px 96px 52px;
        animation: fadeOut 0.7s 5.15s var(--exit) forwards;
      }
      .head { text-align: center; flex: none; z-index: 2; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.75s 0.18s var(--expo) both;
      }
      .title {
        margin-top: 16px; font-size: 60px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
        opacity: 0; animation: fadeUp 0.9s 0.32s var(--expo) both;
      }
      /* Two columns + a centre pivot. Before is quiet; After carries the brand. */
      .cmp {
        position: relative;
        width: 100%; max-width: 1560px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 56px;
        align-items: stretch;
      }
      .cmp-col {
        --s: 0.62s;
        min-height: 380px;
        padding: 44px 48px 40px;
        justify-content: center;
        border-radius: 28px;
        display: flex; flex-direction: column;
        opacity: 0;
        transform-origin: var(--ox) 80%;
        animation: fxHinge var(--card-in) var(--s) var(--expo) both;
        will-change: transform, opacity, filter;
      }
      .cmp-col.before {
        --dx: -48px; --ry: calc(var(--card-tilt) * -1.4); --ox: 100%;
        background: color-mix(in srgb, var(--surface) 78%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
        box-shadow: 0 22px 48px color-mix(in srgb, var(--shade, var(--ink)) 45%, transparent);
      }
      .cmp-col.after {
        --dx: 48px; --ry: calc(var(--card-tilt) * 1.4); --ox: 0%; --s: 0.78s;
        background:
          linear-gradient(165deg, color-mix(in srgb, var(--gold) 14%, transparent), transparent 48%),
          color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 32%, transparent);
        box-shadow:
          0 22px 48px color-mix(in srgb, var(--shade, var(--ink)) 48%, transparent),
          inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent);
      }
      .col-head {
        display: flex; align-items: center; gap: 14px;
        font-size: 15px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase;
        opacity: 0; animation: fadeUp 0.7s calc(var(--s) + 0.22s) var(--expo) both;
      }
      .before .col-head { color: var(--muted); }
      .after .col-head { color: var(--gold); }
      .col-head::after {
        content: ''; flex: 1; height: 1px; background: currentColor; opacity: 0.35;
        transform-origin: left; transform: scaleX(0);
        animation: ruleIn 0.8s calc(var(--s) + 0.3s) var(--expo) both;
      }
      .col-title {
        margin-top: 18px; font-size: var(--col-title-size, 34px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.12;
        opacity: 0; animation: fadeUp 0.8s calc(var(--s) + 0.3s) var(--expo) both;
      }
      .before .col-title { color: color-mix(in srgb, var(--text) 78%, var(--muted)); }
      .items { margin-top: 30px; display: grid; gap: 18px; }
      .item {
        display: flex; gap: 16px; align-items: flex-start;
        font-size: var(--item-size, 22px); font-weight: 500; line-height: 1.35; letter-spacing: -0.02em;
        opacity: 0;
      }
      .before .item { animation: fxSlideL 0.7s var(--i) var(--expo) both; }
      .after .item { animation: fxSlideR 0.7s var(--i) var(--expo) both; }
      .before .item { color: color-mix(in srgb, var(--muted) 85%, var(--text)); }
      .mark {
        flex: none; width: 34px; height: 34px; margin-top: 0; border-radius: 50%;
        display: grid; place-items: center;
        animation: fxPop 0.55s calc(var(--i) + 0.1s) var(--pop) both;
      }
      .mark svg { width: 15px; height: 15px; }
      .before .mark {
        background: color-mix(in srgb, var(--muted) 16%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 30%, transparent);
        color: var(--muted);
      }
      .after .mark {
        background: linear-gradient(140deg, var(--gold), var(--amber));
        color: var(--on-accent);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 16%, transparent), 0 8px 20px color-mix(in srgb, var(--gold) 35%, transparent);
      }
      .mark path {
        stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: fxDraw 0.5s calc(var(--i) + 0.3s) var(--inout) both;
      }
      /* Centre pivot: an accent arrow that lands between the columns */
      .pivot {
        position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
        border-radius: 50%; display: grid; place-items: center; z-index: 3;
        background: linear-gradient(140deg, var(--gold), var(--amber));
        color: var(--on-accent);
        box-shadow: 0 0 0 10px color-mix(in srgb, var(--gold) 14%, transparent), 0 18px 44px color-mix(in srgb, var(--gold) 40%, transparent);
        transform: scale(0) rotate(-90deg);
        animation: pivotIn 0.8s 1.1s var(--pop) both;
      }
      @keyframes pivotIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
      .pivot svg { width: 32px; height: 32px; }
      .pivot svg path { stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pivot-pulse {
        position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px;
        border-radius: 50%; border: 2px solid color-mix(in srgb, var(--gold) 60%, transparent); z-index: 2;
        opacity: 0;
        animation: pulse 1.6s 1.5s ease-out both;
      }
      @keyframes pulse { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
      .bloom {
        position: absolute; left: 62%; top: 55%; width: 1200px; height: 620px; margin: -310px 0 0 -600px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 13%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.2s 0.5s ease-out both, fadeOut 0.7s 5.15s var(--exit) forwards;
      }
      /* Vertical master */
      html[data-frame='portrait'] .head { text-align: left; }
      html[data-frame='portrait'] .cmp { max-width: none; grid-template-columns: 1fr; gap: 56px; }
      html[data-frame='portrait'] .cmp-col { min-height: 0; padding: 32px 36px 30px; }
      html[data-frame='portrait'] .items { margin-top: 22px; gap: 14px; }
      html[data-frame='portrait'] .pivot svg { transform: rotate(90deg); }
      html[data-frame='portrait'] .bloom { left: 50%; top: 62%; width: 1000px; height: 1200px; margin: -600px 0 0 -500px; }
    </style>
  </head>
  <body data-duration="6.2">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.32s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        </div>
        <div class="cmp">
          <div class="cmp-col before">
            <div class="col-head" data-edit="left.label" data-edit-raw="{{LEFT_LABEL_RAW}}">{{LEFT_LABEL}}</div>
            <div class="col-title" data-fit="2" data-fit-min="24" data-fit-group="col-title" data-edit="left.title" data-edit-raw="{{LEFT_TITLE_RAW}}">{{LEFT_TITLE}}</div>
            <div class="items">{{LEFT_ITEMS}}</div>
          </div>
          <div class="pivot-pulse"></div>
          <div class="pivot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          <div class="cmp-col after">
            <div class="col-head" data-edit="right.label" data-edit-raw="{{RIGHT_LABEL_RAW}}">{{RIGHT_LABEL}}</div>
            <div class="col-title" data-fit="2" data-fit-min="24" data-fit-group="col-title" data-edit="right.title" data-edit-raw="{{RIGHT_TITLE_RAW}}">{{RIGHT_TITLE}}</div>
            <div class="items">{{RIGHT_ITEMS}}</div>
          </div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
