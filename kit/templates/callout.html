<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Callout plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 4.8s;
        --black-out: 4.2s;
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        padding: 80px;
        animation: fadeOut 0.7s 3.85s var(--exit) forwards;
      }
      .panel {
        width: min(1280px, 100%);
        padding: 64px 72px; border-radius: 28px;
        background: color-mix(in srgb, var(--surface) 82%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
        box-shadow: 0 30px 80px color-mix(in srgb, var(--shade, var(--ink)) 55%, transparent);
        --land: 18px;
        --s: 0.25s;
        opacity: 0;
        transform-origin: 50% 80%;
        animation: fxLand 1s var(--s) var(--expo) both;
      }
      .eyebrow {
        font-size: 14px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold);
      }
      .title {
        margin-top: 18px; font-size: 58px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.08;
      }
      .body {
        margin-top: 22px; font-size: 24px; color: var(--muted); line-height: 1.45; max-width: 44ch;
      }
      .bullets {
        margin-top: 28px; display: grid; gap: 12px;
      }
      .bullet {
        display: flex; gap: 14px; align-items: flex-start; font-size: 20px; font-weight: 500;
        opacity: 0; animation: fadeUp 0.7s var(--s) var(--expo) both;
      }
      .bullet::before {
        content: ''; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; flex: none;
        background: linear-gradient(140deg, var(--gold), var(--amber));
        box-shadow: 0 0 12px color-mix(in srgb, var(--gold) 50%, transparent);
      }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1000px; height: 520px; margin: -260px 0 0 -500px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 11%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.1s ease-out both, fadeOut 0.7s 3.85s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="4.8">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="panel">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="2" data-fit-min="40" data-fit-max="{{TITLE_MAX}}" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.45s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
          <p class="body" data-edit="body" data-edit-kind="text" data-edit-raw="{{BODY_RAW}}">{{BODY}}</p>
          <div class="bullets">{{BULLETS}}</div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
