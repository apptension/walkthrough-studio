<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opening plate · split hero</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.7s;
        --t-wipe-l: 0.8s;
        --t-wipe-r: 0.92s;
        --t-draw: 0.95s;
        --t-word: 1.15s;
        --t-trace: 0.55s;
        --t-travel: 0.85s;
        --t-sweep: 2.35s;
        --t-flare: 2.05s;
        --x-copy: 5.0s;
        --x-logo: 5.12s;
        --t-eyebrow: 1.32s;
        /* Open lockup — Editor Colours & motion → Open lockup */
        --open-logo: 1;
        --hold-from: 0s;
        --hold-until: 0s;
      }
      /* Split hero: an opaque brand panel carries the lockup; the promise sits beside it. */
      .panel-exit {
        position: absolute; left: 96px; top: 96px; bottom: 96px; width: 780px; z-index: 2;
        animation: panelOut 0.75s var(--x-logo) var(--exit) forwards;
      }
      .panel {
        position: absolute; inset: 0; border-radius: 40px; overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 30% 22%, color-mix(in srgb, var(--gold) 24%, var(--surface)) 0%, transparent 70%),
          linear-gradient(155deg, color-mix(in srgb, var(--surface) 88%, var(--amber)) 0%, var(--surface) 52%, color-mix(in srgb, var(--surface) 70%, var(--ink)) 100%);
        border: 1px solid color-mix(in srgb, var(--gold) 30%, var(--surface));
        box-shadow: 0 40px 120px color-mix(in srgb, var(--ink) 70%, transparent), inset 0 1px 0 color-mix(in srgb, var(--text) 12%, transparent);
        clip-path: inset(0 100% 0 0 round 40px);
        animation: panelIn 1.15s 0.12s var(--expo) both;
      }
      @keyframes panelIn {
        from { clip-path: inset(0 100% 0 0 round 40px); transform: translateX(-48px); }
        to { clip-path: inset(0 0 0 0 round 40px); transform: none; }
      }
      @keyframes panelOut {
        from { clip-path: inset(0 0 0 0 round 40px); opacity: 1; }
        to { clip-path: inset(0 0 0 100% round 40px); opacity: 0.4; }
      }
      /* Dot field drifts slower than the lockup — two depths inside one panel. */
      .panel::before {
        content: ''; position: absolute; inset: -10%;
        background-image: radial-gradient(color-mix(in srgb, var(--gold) 34%, transparent) 1.4px, transparent 1.6px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 80%, #000 0%, transparent 70%);
        mask-image: radial-gradient(ellipse 70% 60% at 70% 80%, #000 0%, transparent 70%);
        opacity: 0.55;
        animation: dotDrift var(--dur) cubic-bezier(0.45, 0, 0.55, 1) both;
      }
      @keyframes dotDrift { from { transform: translate(0, 0); } to { transform: translate(-36px, -22px); } }
      .panel::after {
        content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
        background: linear-gradient(180deg, var(--gold), var(--amber));
        transform: scaleY(0); transform-origin: 50% 0;
        animation: edgeIn 1s 0.75s var(--expo) both;
      }
      @keyframes edgeIn { to { transform: scaleY(1); } }
      .lockup-exit {
        position: absolute; left: 50%; top: 50%;
        width: clamp(240px, calc(var(--open-logo-width, 820px) * 0.9), 520px);
        transform: translate(-50%, -50%);
        opacity: var(--open-logo, 1);
      }
      .lockup { animation: lockDrift var(--dur) cubic-bezier(0.45, 0, 0.55, 1) both; }
      @keyframes lockDrift { from { transform: translateY(14px) scale(0.97); } to { transform: translateY(-10px) scale(1.02); } }
      .logo { filter: drop-shadow(0 18px 50px color-mix(in srgb, var(--amber) 28%, transparent)); }

      .copy-exit {
        position: absolute; left: 980px; right: 120px; top: 50%; transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: flex-start; text-align: left;
      }
      .eyebrow-exit { --xe: 0.3s; }
      .eyebrow {
        display: flex; align-items: center; gap: 14px;
        font-size: 15px; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold);
        opacity: 0;
        animation: eyebrowIn 0.95s var(--t-eyebrow) var(--expo) both;
      }
      .eyebrow::before {
        content: ''; width: 44px; height: 2px; background: currentColor; transform-origin: left center;
        opacity: 0; transform: scaleX(0);
        animation: ruleIn 0.75s var(--t-eyebrow) var(--expo) both;
      }
      .title {
        margin-top: 26px; max-width: 820px;
        font-size: {{TITLE_SIZE}}px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
      }
      .title .accent {
        background: linear-gradient(92deg, var(--gold) 0%, var(--amber) 72%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub-exit { --xe: 0s; margin-top: 34px; }
      .sub {
        font-size: 24px; font-weight: 500; color: var(--muted); letter-spacing: -0.005em; line-height: 1.4;
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.15em 0.35em; max-width: 34ch;
      }
      .sub .word { display: inline-block; opacity: 0; animation: subWordIn 0.9s var(--t) var(--expo) both; }
      .sub .sep { display: inline-block; opacity: 0; color: color-mix(in srgb, var(--muted) 70%, var(--gold)); animation: fadeIn 0.55s var(--t) ease-out both; }
      .sub b { color: var(--text); font-weight: 600; }
      .glow {
        position: absolute; left: 96px; top: 50%; width: 1100px; height: 900px; margin-top: -450px; border-radius: 50%;
        background: radial-gradient(ellipse at 35% 50%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 66%);
        opacity: 0; z-index: 1;
        animation: fadeIn 1.6s 0.3s ease-out both, fadeOut 0.8s var(--x-logo) var(--exit) forwards;
      }
      /* Vertical master: panel on top, copy below. */
      html[data-frame='portrait'] .panel-exit { left: 64px; right: 64px; top: 140px; bottom: auto; width: auto; height: 700px; }
      html[data-frame='portrait'] .copy-exit { left: 80px; right: 72px; top: 1000px; transform: none; }
      html[data-frame='portrait'] .title { font-size: calc({{TITLE_SIZE}}px * 0.86); max-width: none; }
      html[data-frame='portrait'] .sub { font-size: 32px; max-width: none; }
      html[data-frame='portrait'] .eyebrow { font-size: 20px; }
      html[data-frame='portrait'] .lockup-exit { width: clamp(300px, calc(var(--open-logo-width, 820px) * 1.1), 640px); }
    </style>
  </head>
  <body data-duration="6.4" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="glow"></div>
      <div class="flare"></div>
      <div class="panel-exit">
        <div class="panel">
          <div class="lockup-exit">
            <div class="lockup">
              <div class="logo">{{LOGO}}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="copy-exit">
        <div class="line-exit eyebrow-exit">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        </div>
        <h1 class="title" data-fit="{{TITLE_LINES}}" data-fit-min="52" data-reveal="{{TITLE_REVEAL}}" style="--t: {{T_TITLE}}" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        <div class="line-exit sub-exit">
          <p class="sub" data-edit="sub" data-edit-kind="source" data-edit-accent="b" data-edit-beats="1" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
