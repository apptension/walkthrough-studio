<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Custom plate</title>
    <!--
      The starting point for a layout authored for one video.

      Copy this file to videos/<slug>/templates/<name>.html, set `template: "<name>"` on the plate,
      and make it yours. Every placeholder the builder fills for a custom plate is used below, so
      the list of what is available is the file itself: brand vars and font in the head; eyebrow,
      title, sub and body in the compose; the rows, their count, and a screenshot.

      Keep every `data-edit` attribute: that is what makes the copy editable in Studio, and what
      lets the editor paint a change without rebuilding. Animate with the brand's own easings
      (--expo, --exit, --pop) and colours (--gold, --amber, --teal, --surface, --ink, --muted) so a
      custom slide still looks like the rest of the video. `.stage`, `.grain`, `.black` and the
      `data-duration` on <body> are how the renderer times and frames the plate — keep them too.
    -->
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 5.6s;
        --black-out: 5s;
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 40px; padding: 96px 110px; text-align: center;
        animation: fadeOut 0.7s 4.65s var(--exit) forwards;
      }
      .title { font-size: 74px; font-weight: 650; letter-spacing: -0.045em; line-height: 1.06; }
      .sub {
        font-size: 26px; color: var(--muted); line-height: 1.4; max-width: 46ch;
        opacity: 0; animation: subWordIn 0.9s 0.95s var(--expo) both;
      }
      .body {
        font-size: 22px; color: var(--muted); line-height: 1.5; max-width: 54ch;
        opacity: 0; animation: fadeUp 0.8s 1.1s var(--expo) both;
      }
      .items {
        display: grid; gap: 20px; width: min(1500px, 100%);
        grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
      }
      .items[data-n='1'], .items[data-n='2'] { --cols: var(--n, 2); }
      .items[data-n='4'] { --cols: 2; }
      .item {
        padding: 30px 32px; border-radius: 22px; text-align: left;
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
        opacity: 0; animation: fadeUp 0.75s var(--s) var(--expo) both;
      }
      .item-value {
        font-size: 48px; font-weight: 680; letter-spacing: -0.04em; line-height: 1;
        background: linear-gradient(140deg, var(--gold), var(--amber));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .item-label { margin-top: 10px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      .item-note { margin-top: 8px; font-size: 18px; color: var(--muted); line-height: 1.4; }
      .item .icon { width: 40px; height: 40px; margin-bottom: 14px; color: var(--gold); }
      .item img { width: 100%; border-radius: 12px; margin-bottom: 16px; }
      /* The screenshot is opt-in: with no asset set the builder paints a mock, which a plate
         that is not about an interface should not show. */
      .compose:not(:has(.shot img)) .shot { display: none; }
      .shot {
        width: min(1100px, 100%); border-radius: 20px; overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
        box-shadow: 0 30px 80px color-mix(in srgb, var(--shade, var(--ink)) 50%, transparent);
        opacity: 0; animation: fxLand 1s 0.8s var(--expo) both;
      }
      .shot img { display: block; width: 100%; }
      .bloom {
        position: absolute; left: 50%; top: 46%; width: 1200px; height: 640px; margin: -320px 0 0 -600px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 11%, transparent), transparent 70%);
        opacity: 0; animation: fadeIn 1.1s 0.1s ease-out both, fadeOut 0.7s 4.65s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="5.6" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        <h1 class="title" data-fit="3" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.35s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        <p class="sub" data-edit="sub" data-edit-kind="text" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        <p class="body" data-edit="body" data-edit-kind="long" data-edit-raw="{{BODY_RAW}}">{{BODY}}</p>
        <div class="items" data-n="{{ITEM_COUNT}}" style="--n: {{ITEM_COUNT}}">{{ITEMS}}</div>
        <div class="shot" data-slot="shot" data-slot-kind="asset">{{SHOT}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
