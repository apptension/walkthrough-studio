<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Statement plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 5.6s;
        --black-out: 5.0s;
        --title-size: {{TITLE_SIZE}}px;
        --t-sub: {{T_SUB}}s;
        /* Brand mark — Editor Colours & motion → Brand mark (bottom-right seat). */
        --mark-logo: 1;
        --mark-logo-size: 30px;
        --mark-logo-width: 180px;
        --mark-logo-x: 120px;
        --mark-logo-y: 96px;
      }
      /* Editorial, left-anchored: an accent bar, the eyebrow, 1–3 kinetic lines, a rule, one sub. */
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center;
        padding: 0 220px 0 300px;
        animation: fadeOut 0.7s 4.6s var(--exit) forwards;
      }
      .bar {
        position: absolute; left: 236px; top: 50%; width: 8px; height: 360px; margin-top: -180px; border-radius: 4px;
        background: linear-gradient(180deg, var(--gold), var(--amber));
        box-shadow: 0 0 32px color-mix(in srgb, var(--gold) 45%, transparent);
        transform: scaleY(0); transform-origin: 50% 0%;
        animation: barGrow 1.1s 0.2s var(--expo) both;
      }
      @keyframes barGrow { from { transform: scaleY(0); opacity: 0; } 30% { opacity: 1; } to { transform: scaleY(1); opacity: 1; } }
      .eyebrow {
        opacity: 0; animation: eyebrowIn 0.9s 0.18s var(--expo) both;
      }
      .title {
        margin-top: 22px; max-width: 1400px;
        font-size: var(--title-size); font-weight: 600; letter-spacing: -0.05em; line-height: 1.02;
        text-wrap: balance;
      }
      .s-line { display: block; }
      .title .mask.word { padding-bottom: 0.14em; margin-bottom: -0.14em; margin-right: 0.26em; }
      .rule {
        margin-top: 34px; width: 220px; height: 2px;
        background: linear-gradient(90deg, var(--gold), transparent);
        transform-origin: left; transform: scaleX(0);
        animation: ruleIn 0.9s calc(var(--t-sub) - 0.25s) var(--expo) both;
      }
      .sub {
        margin-top: 24px; max-width: 980px;
        font-size: 28px; font-weight: 500; line-height: 1.4; letter-spacing: -0.015em; color: var(--muted);
        opacity: 0; animation: subWordIn 0.9s var(--t-sub) var(--expo) both;
      }
      .sub:empty, .sub:empty + * { display: none; }
      .sub b { color: var(--text); font-weight: 600; }
      .bloom {
        position: absolute; left: 36%; top: 50%; width: 1500px; height: 760px; margin: -380px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.2s 0.1s ease-out both, fadeOut 0.7s 4.6s var(--exit) forwards;
      }
      .corner-logo {
        position: absolute;
        right: var(--mark-logo-x, 120px);
        bottom: var(--mark-logo-y, 96px);
        width: var(--mark-logo-width, 180px);
        opacity: 0;
        animation: markIn 0.85s calc(var(--t-sub) + 0.35s) var(--expo) both;
      }
      /* Layout: kinetic — centred, oversized words slam in; streaks cross once behind them. */
      body[data-layout='kinetic'] .compose { align-items: center; text-align: center; padding: 0 140px; }
      body[data-layout='kinetic'] .bar { display: none; }
      body[data-layout='kinetic'] .title { max-width: 1640px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.96; }
      body[data-layout='kinetic'] .title .mask.word .rise {
        animation-name: slam; animation-duration: 0.85s; animation-timing-function: var(--expo); transform-origin: 50% 100%;
      }
      @keyframes slam {
        0% { opacity: 0; transform: translateY(105%) scale(1.3) skewY(6deg); filter: blur(10px); }
        55% { opacity: 1; filter: blur(0); }
        100% { opacity: 1; transform: none; filter: none; }
      }
      body[data-layout='kinetic'] .rule { margin-inline: auto; width: 300px; background: linear-gradient(90deg, transparent, var(--gold), transparent); transform-origin: center; }
      body[data-layout='kinetic'] .sub { margin-inline: auto; }
      body[data-layout='kinetic'] .bloom { left: 50%; }
      body[data-layout='kinetic'] .compose::before,
      body[data-layout='kinetic'] .compose::after {
        content: ''; position: absolute; left: 0; height: 2px; width: 900px; opacity: 0; pointer-events: none;
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gold) 80%, transparent), transparent);
        animation: streak 1.1s 0.25s var(--quint) both;
      }
      body[data-layout='kinetic'] .compose::before { top: 30%; }
      body[data-layout='kinetic'] .compose::after { top: 70%; height: 1px; animation-delay: 0.45s; }
      @keyframes streak {
        0% { opacity: 0; transform: translateX(-900px); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateX(2200px); }
      }
      /* Layout: marquee — outlined ribbons of the line scroll in opposite directions behind it. */
      .ribbon { display: none; }
      body[data-layout='marquee'] .ribbon {
        display: block; position: absolute; left: -10%; right: -10%; z-index: 1; overflow: hidden; white-space: nowrap; pointer-events: none;
        transform: rotate(-4deg);
        opacity: 0;
        animation: fadeIn 0.9s 0.1s ease-out both, fadeOut 0.7s 4.5s var(--exit) forwards;
      }
      body[data-layout='marquee'] .ribbon.r1 { top: 4%; }
      body[data-layout='marquee'] .ribbon.r2 { bottom: 3%; }
      body[data-layout='marquee'] .track {
        display: inline-flex; align-items: center; gap: 56px;
        font-size: 150px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1;
        color: transparent; -webkit-text-stroke: 1px color-mix(in srgb, var(--gold) 24%, transparent);
        animation: marqL 5.6s linear both;
      }
      body[data-layout='marquee'] .r2 .track { -webkit-text-stroke-color: color-mix(in srgb, var(--muted) 20%, transparent); animation-name: marqR; }
      body[data-layout='marquee'] .track i {
        flex: none; width: 22px; height: 22px; transform: rotate(45deg);
        background: color-mix(in srgb, var(--gold) 30%, transparent);
      }
      @keyframes marqL { from { transform: translateX(0); } to { transform: translateX(-18%); } }
      @keyframes marqR { from { transform: translateX(-26%); } to { transform: translateX(-8%); } }
      body[data-layout='marquee'] .compose { z-index: 2; align-items: center; text-align: center; padding: 0 180px; }
      body[data-layout='marquee'] .bar { display: none; }
      body[data-layout='marquee'] .rule { margin-inline: auto; width: 260px; background: linear-gradient(90deg, transparent, var(--gold), transparent); transform-origin: center; }
      body[data-layout='marquee'] .sub { margin-inline: auto; }
      body[data-layout='marquee'] .bloom { left: 50%; }
      html[data-frame='portrait'] body[data-layout='marquee'] .track { font-size: 120px; }
      html[data-frame='portrait'] body[data-layout='kinetic'] .compose,
      html[data-frame='portrait'] body[data-layout='marquee'] .compose { padding: 0 64px; }
      /* Vertical master */
      html[data-frame='portrait'] .compose { padding: 0 52px 0 88px; }
      html[data-frame='portrait'] .bar { left: 44px; height: 420px; margin-top: -210px; }
      html[data-frame='portrait'] .title { max-width: none; }
      html[data-frame='portrait'] .sub { max-width: none; }
      html[data-frame='portrait'] .bloom { left: 50%; width: 1000px; height: 1300px; margin: -650px 0 0 -500px; }
      html[data-frame='portrait'] .corner-logo { right: var(--mark-logo-x, 72px); bottom: var(--mark-logo-y, 120px); }
    </style>
  </head>
  <body data-duration="5.6" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="flare" style="--t-flare: 1.1s"></div>
      {{MARQUEE}}
      <div class="compose">
        <div class="bar" aria-hidden="true"></div>
        <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        <h1 class="title" data-fit="3" data-fit-min="52" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.42s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">
          {{TITLE_LINES}}
        </h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="sub" data-edit="sub" data-edit-kind="text" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        <div class="corner-logo">{{LOGO}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
