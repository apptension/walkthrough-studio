<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checklist plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.75s;
        --n: {{ITEM_COUNT}};
        --ck-start: {{CK_START}}s;
        --ck-span: {{CK_SPAN}}s;
        --card-in: var(--motion-enter, 0.9s);
      }
      /* Title left, one panel right: rows check off in order while the bar and counter keep score. */
      .compose {
        position: absolute; inset: 0;
        display: grid; grid-template-columns: 560px 1fr; gap: 110px; align-items: center;
        padding: 72px 180px;
        animation: fadeOut 0.7s 5.35s var(--exit) forwards;
      }
      .head { z-index: 2; }
      .eyebrow {
        opacity: 0; animation: fadeUp 0.75s 0.18s var(--expo) both;
      }
      .title {
        margin-top: 18px; font-size: 62px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04;
        opacity: 0; animation: fadeUp 0.9s 0.32s var(--expo) both;
      }
      .score {
        margin-top: 36px; display: flex; align-items: baseline; gap: 10px;
        opacity: 0; animation: fadeUp 0.8s 0.6s var(--expo) both;
      }
      .score .n {
        display: inline-grid; font-size: 72px; font-weight: 700; letter-spacing: -0.05em; line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      /* Digits 0…n share one cell; each shows at its check (--in) and hides at the next (--out). */
      .score .n i {
        grid-area: 1 / 1; font-style: normal;
        background: linear-gradient(120deg, var(--text), var(--gold));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0;
        animation: fadeIn 0.01s var(--in) both, fadeOut 0.01s var(--out) forwards;
      }
      .score .of { font-size: 24px; font-weight: 600; color: var(--muted); letter-spacing: -0.02em; }
      .panel {
        --s: 0.55s;
        padding: 40px 44px 36px; border-radius: 28px;
        background:
          linear-gradient(165deg, color-mix(in srgb, var(--gold) 10%, transparent), transparent 48%),
          color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 26%, transparent);
        box-shadow:
          0 22px 48px color-mix(in srgb, var(--shade, var(--ink)) 48%, transparent),
          inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent);
        --land: 30px; opacity: 0; transform-origin: 50% 80%;
        animation: fxLand var(--card-in) var(--s) var(--expo) both;
        will-change: transform, opacity, filter;
      }
      .bar {
        height: 4px; border-radius: 2px; margin-bottom: 30px;
        background: color-mix(in srgb, var(--muted) 18%, transparent);
        overflow: hidden;
      }
      .bar i {
        display: block; height: 100%; border-radius: 2px;
        background: linear-gradient(90deg, var(--gold), var(--amber));
        box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 60%, transparent);
        transform: scaleX(0); transform-origin: left;
        animation: barFill var(--ck-span) var(--ck-start) steps(var(--n), jump-end) both;
      }
      @keyframes barFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .rows { display: flex; flex-direction: column; gap: 0; }
      .ck-row {
        display: grid; grid-template-columns: 44px 1fr; gap: 22px; align-items: start;
        padding: 18px 6px;
        border-top: 1px solid color-mix(in srgb, var(--muted) 12%, transparent);
        opacity: 0;
        animation: fxSlideR 0.7s var(--s) var(--expo) both;
      }
      .ck-row:first-child { border-top: 0; padding-top: 4px; }
      .ck-box {
        width: 44px; height: 44px; border-radius: 13px; margin-top: 2px;
        display: grid; place-items: center;
        border: 2px solid color-mix(in srgb, var(--muted) 40%, transparent);
        color: var(--on-accent, #041004);
        animation: boxFill 0.45s calc(var(--s) + 0.3s) var(--pop) both;
      }
      @keyframes boxFill {
        from { background: transparent; border-color: color-mix(in srgb, var(--muted) 40%, transparent); transform: scale(1); box-shadow: none; }
        50% { transform: scale(1.12); }
        to { background: linear-gradient(140deg, var(--gold), var(--amber)); border-color: transparent; transform: scale(1); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 16%, transparent), 0 8px 22px color-mix(in srgb, var(--gold) 38%, transparent); }
      }
      .ck-box svg { width: 24px; height: 24px; }
      .ck-box path {
        stroke: currentColor; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: fxDraw 0.45s calc(var(--s) + 0.42s) var(--inout) both;
      }
      .ck-label {
        font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.18;
        color: color-mix(in srgb, var(--text) 72%, var(--muted));
        animation: labelLit 0.5s calc(var(--s) + 0.35s) ease-out both;
      }
      @keyframes labelLit { from { color: color-mix(in srgb, var(--text) 72%, var(--muted)); } to { color: var(--text); } }
      .ck-note { margin-top: 6px; font-size: 18px; line-height: 1.4; color: var(--muted); }
      .rows[data-n="5"] .ck-label, .rows[data-n="6"] .ck-label { font-size: 26px; }
      .rows[data-n="5"] .ck-note, .rows[data-n="6"] .ck-note { font-size: 16px; }
      .rows[data-n="6"] .ck-row { padding: 13px 6px; }
      .bloom {
        position: absolute; left: 60%; top: 50%; width: 1300px; height: 700px; margin: -350px 0 0 -650px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.2s 0.3s ease-out both, fadeOut 0.7s 5.35s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="6.4">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="head">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <h1 class="title" data-fit="3" data-fit-min="40" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.32s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
          <div class="score" aria-hidden="true"><span class="n">{{COUNTER}}</span><span class="of">/ {{ITEM_COUNT}} done</span></div>
        </div>
        <div class="panel">
          <div class="bar" aria-hidden="true"><i></i></div>
          <div class="rows" data-n="{{ITEM_COUNT}}">{{ITEMS}}</div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
