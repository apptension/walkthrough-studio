<style>{{OVERLAY_CSS}}
  .wt-cap {
    --wt-font: {{FONT}};
    --wt-ink: {{INK}};
    --wt-surface: {{SURFACE}};
    --wt-gold: {{GOLD}};
    --wt-amber: {{AMBER}};
    --wt-text: {{TEXT}};
    --wt-muted: {{MUTED}};
    --wt-on-accent: {{ON_ACCENT}};
    --cap-max: {{CAP_MAX}}px;
    --cap-bottom: {{CAP_BOTTOM}}px;
    --cap-inset: {{CAP_INSET}}px;
    --cap-align: {{CAP_ALIGN}};
    --x-out: {{X_OUT}}s;
    --hold: {{HOLD}}s;
    --hold-start: {{HOLD_START}}s;
  }
</style>
<div
  class="wt wt-cap atm-{{ATMOSPHERE}} energy-{{ENERGY}}"
  data-seat="{{SEAT}}"
  data-align="{{CAP_ALIGN}}"
  data-sheen="{{SHEEN}}"
  data-kind="caption"
  data-flow-index="{{FLOW_INDEX}}"
>
  <div class="seat">
    <div class="card">
      {{WAVE_FIELD}}
      <div class="glow"></div>
      <div class="sheen"></div>
      <div class="num">{{NUM}}</div>
      <div class="txt">
        <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        <div class="title" data-edit="title" data-edit-kind="text" data-edit-raw="{{TITLE_RAW}}">
          <span class="mask"><span>{{TITLE}}</span></span>
        </div>
        {{BODY_BLOCK}}
      </div>
      <div class="rail"></div>
      <div class="timer"></div>
    </div>
  </div>
</div>
