<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Opening plate · gradient mesh</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.7s;
        --t-wipe-l: 0.95s;
        --t-wipe-r: 1.05s;
        --t-draw: 1.1s;
        --t-word: 1.25s;
        --t-trace: 0.8s;
        --t-travel: 0.7s;
        --t-sweep: 2.15s;
        --t-flare: 1.9s;
        --x-copy: 5.0s;
        --x-logo: 5.12s;
        --t-eyebrow: 1.6s;
        --open-logo: 1;
        --hold-from: 0s;
        --hold-until: 0s;
      }
      /* Gradient mesh: brand-colour fields bloom through an iris, the lockup crowns the promise. */
      .mesh {
        position: absolute; inset: 0; z-index: 1; overflow: hidden;
        background: var(--ink);
        clip-path: circle(0% at 50% 52%);
        animation: irisOpen 1.7s 0.1s var(--expo) both, irisClose 0.85s var(--x-logo) var(--exit) forwards;
      }
      @keyframes irisOpen { from { clip-path: circle(0% at 50% 52%); } to { clip-path: circle(78% at 50% 52%); } }
      @keyframes irisClose { from { clip-path: circle(78% at 50% 52%); } to { clip-path: circle(0% at 50% 52%); } }
      .m {
        position: absolute; width: 1100px; height: 1100px; border-radius: 50%; filter: blur(90px);
        animation: orbit var(--dur) cubic-bezier(0.45, 0, 0.55, 1) both;
      }
      .m.a { left: -6%; top: -30%; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 70%, transparent), transparent 66%); --dx: 160px; --dy: 90px; }
      .m.b { right: -12%; top: -12%; background: radial-gradient(circle, color-mix(in srgb, var(--amber) 62%, transparent), transparent 66%); --dx: -140px; --dy: 120px; }
      .m.c { left: 18%; bottom: -55%; background: radial-gradient(circle, color-mix(in srgb, var(--teal) 58%, transparent), transparent 66%); --dx: 120px; --dy: -110px; }
      .m.d { right: 10%; bottom: -48%; width: 900px; height: 900px; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 40%, var(--surface)), transparent 68%); --dx: -100px; --dy: -60px; }
      @keyframes orbit {
        from { transform: translate(0, 0) scale(0.92); }
        to { transform: translate(var(--dx), var(--dy)) scale(1.08); }
      }
      .veil {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 62% 58% at 50% 58%, color-mix(in srgb, var(--ink) 74%, transparent) 0%, color-mix(in srgb, var(--ink) 40%, transparent) 62%, color-mix(in srgb, var(--ink) 18%, transparent) 100%);
      }
      .ring {
        position: absolute; left: 50%; top: 52%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--gold) 55%, transparent);
        opacity: 0; z-index: 2;
        animation: ringOut 1.7s 0.1s var(--expo) both;
      }
      @keyframes ringOut {
        0% { opacity: 0; transform: scale(0.02); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: scale(1); }
      }
      .lockup-exit {
        position: absolute; left: 50%; top: 21%; z-index: 3;
        width: clamp(200px, calc(var(--open-logo-width, 820px) * 0.6), 430px);
        margin-left: calc(clamp(200px, calc(var(--open-logo-width, 820px) * 0.6), 430px) / -2);
        opacity: var(--open-logo, 1);
        animation: exitScale calc(0.7s * var(--open-logo, 1)) var(--x-logo) var(--exit) forwards;
      }
      .lockup { animation: float var(--dur) cubic-bezier(0.45, 0, 0.55, 1) both; }
      @keyframes float { from { transform: translateY(10px); } to { transform: translateY(-10px); } }
      .logo { filter: drop-shadow(0 14px 44px color-mix(in srgb, var(--ink) 60%, transparent)); }
      .copy-exit {
        position: absolute; left: 0; right: 0; top: 43%; z-index: 3; padding: 0 140px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .eyebrow-exit { --xe: 0.3s; }
      .eyebrow {
        font-size: var(--eyebrow-size); font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; color: var(--text);
        padding: 10px 20px; border-radius: 999px;
        background: color-mix(in srgb, var(--ink) 82%, var(--gold));
        border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--ink));
        opacity: 0;
        animation: eyebrowIn 0.95s var(--t-eyebrow) var(--expo) both;
      }
      .title {
        margin-top: 30px; font-size: {{TITLE_SIZE}}px; font-weight: 650; letter-spacing: -0.05em; line-height: 1.02;
        text-shadow: 0 6px 40px color-mix(in srgb, var(--ink) 70%, transparent);
      }
      .title .accent {
        background: linear-gradient(92deg, var(--gold) 0%, var(--amber) 72%);
        -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
      }
      .sub-exit { --xe: 0s; margin-top: 32px; }
      .sub {
        font-size: 24px; font-weight: 500; color: color-mix(in srgb, var(--text) 78%, var(--muted));
        display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0.15em 0.35em; max-width: 56ch;
      }
      .sub .word { display: inline-block; opacity: 0; animation: subWordIn 0.9s var(--t) var(--expo) both; }
      .sub .sep { display: inline-block; opacity: 0; color: var(--gold); animation: fadeIn 0.55s var(--t) ease-out both; }
      .sub b { color: var(--text); font-weight: 600; }
      html[data-frame='portrait'] .m { width: 1300px; height: 1300px; }
      html[data-frame='portrait'] .lockup-exit {
        top: 20%;
        width: clamp(260px, calc(var(--open-logo-width, 820px) * 0.8), 600px);
        margin-left: calc(clamp(260px, calc(var(--open-logo-width, 820px) * 0.8), 600px) / -2);
      }
      html[data-frame='portrait'] .copy-exit { top: 40%; padding: 0 64px; }
      html[data-frame='portrait'] .title { font-size: calc({{TITLE_SIZE}}px * 0.8); text-wrap: balance; }
      html[data-frame='portrait'] .sub { font-size: 32px; max-width: none; }
      html[data-frame='portrait'] .eyebrow { font-size: 23px; }
    </style>
  </head>
  <body data-duration="6.4" data-layout="{{LAYOUT}}">
    <div class="stage">
      <div class="bg"></div>
      <div class="mesh">
        <div class="m a"></div>
        <div class="m b"></div>
        <div class="m c"></div>
        <div class="m d"></div>
        <div class="veil"></div>
      </div>
      <div class="ring"></div>
      <div class="flare"></div>
      <div class="lockup-exit">
        <div class="lockup">
          <div class="logo">{{LOGO}}</div>
        </div>
      </div>
      <div class="copy-exit">
        <div class="line-exit eyebrow-exit">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
        </div>
        <h1 class="title" data-fit="{{TITLE_LINES}}" data-fit-min="56" data-reveal="{{TITLE_REVEAL}}" style="--t: {{T_TITLE}}" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h1>
        <div class="line-exit sub-exit">
          <p class="sub" data-edit="sub" data-edit-kind="source" data-edit-accent="b" data-edit-beats="1" data-edit-raw="{{SUB_RAW}}">{{SUB}}</p>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
