<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quote plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.4s;
        --black-out: 5.75s;
        --card-in: var(--motion-enter, 0.9s);
        --t-meta: {{T_META}}s;
        /* Corner lockup draws with the card, not on the open-plate clock. */
        --t-trace: 0.7s;
        --t-travel: 0.4s;
        --t-wipe-l: 0.85s;
        --t-wipe-r: 0.97s;
        /* Brand mark — Editor Colours & motion → Brand mark (top-right of the card). */
        --mark-logo: 1;
        --mark-logo-size: 30px;
        --mark-logo-width: 170px;
        --mark-logo-x: 72px;
        --mark-logo-y: 36px;
      }
      .compose {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 72px 120px;
        animation: fadeOut 0.75s 5.35s var(--exit) forwards;
      }
      .q-card {
        --s: 0.3s;
        position: relative;
        width: min(1280px, 100%);
        padding: 64px 72px;
        border-radius: 28px;
        background:
          linear-gradient(165deg, color-mix(in srgb, var(--gold) 14%, transparent), transparent 48%),
          color-mix(in srgb, var(--surface) 88%, transparent);
        border: 1px solid color-mix(in srgb, var(--gold) 32%, transparent);
        box-shadow:
          0 22px 48px color-mix(in srgb, var(--shade, var(--ink)) 48%, transparent),
          inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent);
        --land: 22px;
        opacity: 0;
        transform-origin: 50% 85%;
        animation: fxLand var(--card-in) var(--s) var(--expo) both;
        display: grid; grid-template-columns: 1fr; gap: 40px;
      }
      .eyebrow {
        position: absolute; left: 72px; top: 36px;
        opacity: 0; animation: fadeUp 0.7s 0.55s var(--expo) both;
      }
      /* Same quote mark as the testimonial cards: in the flow, above the words, never under them. */
      .mark {
        position: relative; z-index: 1;
        margin-top: 12px; height: 52px;
        font-size: 88px; line-height: 0.7; font-weight: 700; letter-spacing: -0.06em;
        background: linear-gradient(140deg, var(--gold), var(--amber));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0; filter: blur(6px);
        animation: markIn 0.7s 0.55s var(--pop) both;
      }
      @keyframes markIn {
        from { opacity: 0; transform: translateY(16px) scale(0.8); filter: blur(6px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }
      .stars { display: flex; gap: 6px; margin-top: 30px; }
      .star {
        font-size: 24px; color: var(--gold);
        opacity: 0; transform: scale(0.4);
        animation: starIn 0.5s calc(0.95s + var(--si)) var(--pop) both;
      }
      @keyframes starIn { from { opacity: 0; transform: scale(0.4) rotate(-30deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
      .quote {
        font-size: {{QUOTE_SIZE}}px; font-weight: 500; letter-spacing: -0.028em; line-height: 1.26;
        text-wrap: balance; max-width: {{QUOTE_MEASURE}}ch;
        margin-top: 18px; position: relative; z-index: 1;
      }
      .quote .qw {
        display: inline-block; margin-right: 0.26em;
        opacity: 0; will-change: transform, filter, opacity;
        animation: subWordIn 0.8s var(--t) var(--expo) both;
      }
      .quote .qw:last-child { margin-right: 0; }
      .meta {
        display: flex; align-items: center; gap: 22px;
        padding-top: 32px;
        border-top: 1px solid color-mix(in srgb, var(--muted) 18%, transparent);
        opacity: 0; animation: fadeUp 0.8s var(--t-meta) var(--expo) both;
      }
      .avatar {
        flex: none; width: 66px; height: 66px; border-radius: 50%;
        display: grid; place-items: center;
        font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--on-accent);
        background: linear-gradient(140deg, var(--gold), var(--amber));
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 16%, transparent), 0 12px 28px color-mix(in srgb, var(--gold) 35%, transparent);
        animation: fxPop 0.6s calc(var(--t-meta) + 0.05s) var(--pop) both;
      }
      .badge {
        flex: none; height: 66px; min-width: 150px; padding: 12px 22px; border-radius: 18px;
        display: grid; place-items: center; border: 1px solid transparent;
        transform: scale(0.9); opacity: 0;
        animation: fadeUp 0.7s calc(var(--t-meta) + 0.05s) var(--expo) both;
      }
      .badge[data-tone="light"] { background: linear-gradient(180deg, #fff, #f3f6f1); border-color: color-mix(in srgb, #0a1f0a 10%, transparent); }
      .badge[data-tone="dark"] { background: color-mix(in srgb, var(--surface) 70%, #000 18%); border-color: color-mix(in srgb, var(--muted) 24%, transparent); }
      .badge img { max-height: 40px; max-width: 180px; width: auto; height: auto; object-fit: contain; }
      .who { display: flex; flex-direction: column; gap: 6px; }
      .author { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
      .role { font-size: 17px; color: var(--muted); letter-spacing: 0.01em; }
      .corner-logo {
        position: absolute;
        right: var(--mark-logo-x, 72px);
        top: var(--mark-logo-y, 36px);
        width: var(--mark-logo-width, 170px);
        opacity: 0; z-index: 2;
        animation: markIn 0.85s 1.1s var(--expo) both;
      }
      .bloom {
        position: absolute; left: 50%; top: 50%; width: 1500px; height: 700px; margin: -350px 0 0 -750px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 12%, transparent), transparent 68%);
        opacity: 0; animation: fadeIn 1.2s 0.2s ease-out both, fadeOut 0.7s 5.35s var(--exit) forwards;
      }
    </style>
  </head>
  <body data-duration="6.4">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="compose">
        <div class="q-card">
          <div class="eyebrow" data-edit="eyebrow" data-edit-kind="text" data-edit-raw="{{EYEBROW_RAW}}">{{EYEBROW}}</div>
          <div class="corner-logo">{{LOGO}}</div>
          <div class="mark" aria-hidden="true">“</div>
          <div>
            {{STARS}}
            <blockquote class="quote" data-fit="6" data-fit-min="28" data-fit-max="{{QUOTE_SIZE}}" data-edit="quote" data-edit-kind="source" data-edit-raw="{{QUOTE_RAW}}">{{QUOTE}}</blockquote>
          </div>
          <div class="meta">
            {{WHO_MARK}}
            <div class="who">
              <div class="author" data-edit="author" data-edit-raw="{{AUTHOR_RAW}}">{{AUTHOR}}</div>
              <div class="role" data-edit="role" data-edit-raw="{{ROLE_RAW}}">{{ROLE}}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
