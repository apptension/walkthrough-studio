<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Closing plate</title>
    <link rel="stylesheet" href="{{FONT_CSS}}" />
    <link rel="stylesheet" href="plates.css" />
    <style>
      :root {
        {{BRAND_VARS}}
        --dur: 6.2s;
        --black-out: 5.5s;
        --t-wipe-l: 2.45s;
        --t-wipe-r: 2.55s;
        --t-draw: 2.65s;
        --t-word: 2.85s;
        --t-trace: 2.4s;
        --t-travel: 0.75s;
        --t-sweep: 3.9s;
        --x-title: 4.75s;
        --x-steps: 4.87s;
        --x-logo: 5.0s;
        --n: {{STEP_COUNT}};
        /* Close lockup — editor Colours & motion → Close lockup (defaults match the classic seat). */
        --close-logo: 1;
        --close-logo-top: 78%;
        --close-logo-width: 480px;
        --close-lift-scale: 1;
        --close-lift-y: 0%;
        /* Hint only: renderer probes motion/pixels and will shrink or disable if anything still moves */
        --hold-from: 2.4s;
        --hold-until: 3.85s;
      }
      .title-exit {
        position: absolute; left: 0; right: 0; top: 18%; padding: 0 160px; text-align: center;
        animation: exitUp 0.7s var(--x-title) var(--exit) forwards;
      }
      .title { font-size: 86px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.04; }
      .steps-exit {
        position: absolute; left: 50%; top: 42%; width: 1100px; margin-left: -550px;
        animation: exitUp 0.7s var(--x-steps) var(--exit) forwards;
      }
      .steps { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); }
      .track, .track-fill {
        position: absolute; top: 22px; height: 1px;
        left: calc(1100px / var(--n) / 2); right: calc(1100px / var(--n) / 2);
      }
      .track { background: color-mix(in srgb, var(--muted) 22%, transparent); transform-origin: left; transform: scaleX(0);
        animation: grow 1.1s 1.05s var(--inout) both; }
      .track-fill {
        height: 2px; top: 21.5px;
        background: linear-gradient(90deg, var(--gold), var(--amber));
        box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 60%, transparent);
        transform-origin: left; transform: scaleX(0);
        animation: grow 1.3s 1.25s var(--inout) both;
      }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .step { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .dot {
        position: relative; z-index: 1; width: 48px; height: 48px; border-radius: 50%;
        display: grid; place-items: center; font-size: 17px; font-weight: 700; color: var(--on-accent);
        background: linear-gradient(140deg, var(--gold), var(--amber));
        box-shadow: 0 0 0 6px color-mix(in srgb, var(--amber) 14%, transparent), 0 10px 30px color-mix(in srgb, var(--amber) 35%, transparent);
        animation: fxPop 0.6s var(--s) var(--pop) both;
      }
      .step-label {
        margin-top: 24px; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
        opacity: 0; animation: fadeUp 0.8s calc(var(--s) + 0.12s) var(--expo) both;
      }
      .step-note {
        margin-top: 10px; font-size: 16px; color: var(--muted); max-width: 24ch; line-height: 1.45; text-wrap: balance;
        opacity: 0; animation: fadeUp 0.8s calc(var(--s) + 0.22s) var(--expo) both;
      }
      .lockup-exit {
        position: absolute; left: 50%;
        top: var(--close-logo-top, 78%);
        width: min(var(--close-logo-width, 480px), 28vw);
        margin-left: calc(min(var(--close-logo-width, 480px), 28vw) / -2);
        /* Show logo off (--close-logo: 0) zeros opacity and collapses the exit so keyframes never force it back on. */
        opacity: var(--close-logo, 1);
        animation: exitScale calc(0.75s * var(--close-logo, 1)) var(--x-logo) var(--exit) forwards;
      }
      .logo {
        filter: drop-shadow(0 14px 40px color-mix(in srgb, var(--amber) 22%, transparent));
        transform: translateY(var(--close-lift-y, 0%)) scale(var(--close-lift-scale, 1));
        transform-origin: 50% 50%;
      }
      .platform {
        margin: 20px -140px 0; text-align: center; white-space: nowrap;
        font-size: 15px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
        opacity: 0; animation: fadeUp 0.9s 3.35s var(--expo) both;
      }
      .bloom {
        position: absolute; left: 50%;
        top: calc(var(--close-logo-top, 78%) + 4%);
        width: 900px; height: 360px;
        margin: -180px 0 0 -450px; border-radius: 50%;
        background: radial-gradient(ellipse at center, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%);
        opacity: 0;
        animation: fadeIn 1.4s 2.4s ease-out both, fadeOut 0.8s var(--x-logo) var(--exit) forwards;
      }
      /* Vertical master */
      html[data-frame='portrait'] .title-exit { top: 14%; padding: 0 72px; }
      html[data-frame='portrait'] .title { font-size: 104px; }
      html[data-frame='portrait'] .steps-exit { top: 38%; left: 120px; right: 96px; width: auto; margin-left: 0; }
      html[data-frame='portrait'] .steps { grid-template-columns: 1fr; gap: 44px; }
      html[data-frame='portrait'] .track,
      html[data-frame='portrait'] .track-fill {
        top: 34px; bottom: 34px; left: 33px; right: auto; width: 2px; height: auto;
        transform-origin: center top; transform: scaleY(0); animation-name: growDown;
      }
      html[data-frame='portrait'] .track { width: 1px; left: 33.5px; }
      @keyframes growDown { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      html[data-frame='portrait'] .step {
        display: grid; grid-template-columns: 68px 1fr; column-gap: 28px; align-items: center; text-align: left;
      }
      html[data-frame='portrait'] .dot { width: 68px; height: 68px; font-size: 24px; grid-row: span 2; }
      html[data-frame='portrait'] .step-label { margin-top: 0; font-size: 40px; }
      html[data-frame='portrait'] .step-note { margin-top: 6px; font-size: 26px; max-width: none; text-wrap: pretty; }
      html[data-frame='portrait'] .lockup-exit {
        top: var(--close-logo-top, 80%);
        width: min(var(--close-logo-width, 480px), 50vw);
        margin-left: calc(min(var(--close-logo-width, 480px), 50vw) / -2);
      }
      html[data-frame='portrait'] .platform { font-size: 22px; letter-spacing: 0.22em; white-space: normal; margin: 24px -60px 0; }
      html[data-frame='portrait'] .bloom { width: 900px; height: 520px; margin: -260px 0 0 -450px; }
    </style>
  </head>
  <body data-duration="6.2">
    <div class="stage">
      <div class="bg"></div>
      <div class="blob warm"></div>
      <div class="blob cool"></div>
      <div class="grid"></div>
      <div class="bloom"></div>
      <div class="title-exit">
        <h2 class="title" data-fit="{{TITLE_LINES}}" data-fit-min="52" data-reveal="{{TITLE_REVEAL}}" style="--t: 0.4s" data-edit="title" data-edit-kind="{{TITLE_KIND}}" data-edit-raw="{{TITLE_RAW}}">{{TITLE}}</h2>
      </div>
      <div class="steps-exit">
        <div class="steps">
          <div class="track"></div>
          <div class="track-fill"></div>
          {{STEPS}}
        </div>
      </div>
      <div class="lockup-exit">
        <div class="logo">{{LOGO}}</div>
        <div class="platform" data-edit="tagline" data-edit-kind="text" data-edit-raw="{{PLATFORM_RAW}}">{{PLATFORM}}</div>
      </div>
      <div class="vignette"></div>
    </div>
    <div class="grain"></div>
    <div class="black"></div>
  </body>
</html>
